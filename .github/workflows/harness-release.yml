name: Harness release

# Release archives for amp-harness (AMP KB decisions/amp-harness-architecture.md D11/D12, ticket #2115).
#
# Builds the four v1 targets natively (no cross-compiling), packs each as
# amp-harness-<version>-<target>.tar.gz + .sha256 with v2/harness/scripts/package.sh, installs each
# archive through v2/harness/install.sh on its own runner and runs it, then renders the Homebrew
# formula from the four checksums. Branches, PRs and manual runs stop there (workflow artifacts).
#
# Version stamping (D11, #2122): every build checks that `amp-harness --version` reports the crate
# version (which a tag must match) and the commit it was built from, clean (no -dirty).
#
# Publishing (M5-1 #2122): only a harness-v* tag runs `publish`, which makes a GitHub Release with
# the archives, their .sha256 files, SHA256SUMS, install.sh and the rendered Homebrew formula, using
# GITHUB_TOKEN. It is never marked "latest" (AMP's own releases keep that). A version with a '-' is
# a prerelease (install.sh's "newest" lookup skips those); one with '-test' is a draft as well, for
# exercising this workflow without anything installable. No signing in v1; the Homebrew tap update
# is a template until a tap repo exists. How-to: AMP KB how-to/harness-release.md.
#
# Gate (#2607): on a harness-v* tag, `gate` requires a successful `Harness` (harness.yml) run AND a
# successful `Harness smoke` (harness-smoke.yml) run on the tagged commit (GITHUB_SHA); `publish`
# needs it, so an untested or red commit is never published. The builds run in parallel with it.
# Skipped for -test versions (draft dry runs on off-branch commits have no CI runs). When a
# workflow has no run on the commit (no path filter fired): `gh workflow run <file> --ref <tag>`,
# wait for it to pass, then `gh run rerun <release run id> --failed`.

on:
  push:
    tags: ["harness-v*"]
    branches: [main, "harness-m*", "remote-m*"]
    paths:
      - "v2/harness/install.sh"
      - "v2/harness/scripts/package.sh"
      - "v2/harness/scripts/render-formula.sh"
      - "v2/harness/scripts/test-install.sh"
      - "v2/harness/scripts/test-install-distros.sh"
      - "v2/harness/scripts/pty-run.py"
      - "v2/harness/packaging/**"
      - "v2/harness/Makefile"
      - "v2/harness/Cargo.toml"
      - "v2/harness/Cargo.lock"
      - "v2/harness/rust-toolchain.toml"
      - ".github/workflows/harness-release.yml"
  pull_request:
    paths:
      - "v2/harness/install.sh"
      - "v2/harness/scripts/package.sh"
      - "v2/harness/scripts/render-formula.sh"
      - "v2/harness/scripts/test-install.sh"
      - "v2/harness/scripts/test-install-distros.sh"
      - "v2/harness/scripts/pty-run.py"
      - "v2/harness/packaging/**"
      - "v2/harness/Makefile"
      - "v2/harness/Cargo.toml"
      - "v2/harness/Cargo.lock"
      - "v2/harness/rust-toolchain.toml"
      - ".github/workflows/harness-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Offline installer tests (stub binary, file:// release mirror, temp HOME) on both OS families:
  # Linux runs install.sh under dash, macOS under bash-as-sh. Fresh install, upgrade (old → new),
  # --uninstall, --preset passthrough, no-TTY output, and the setup handoff on a pseudo-terminal
  # (scripts/pty-run.py, python3 from the runner image). Linux also runs install.sh inside distro
  # containers: Debian slim (no curl/wget), Ubuntu with wget only, glibc 2.31 and Alpine (refused).
  install-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh v2/harness/install.sh v2/harness/scripts/package.sh v2/harness/scripts/render-formula.sh v2/harness/scripts/test-install.sh v2/harness/scripts/test-install-distros.sh
      - name: installer tests
        run: |
          python3 --version
          v2/harness/scripts/test-install.sh
      - name: installer on Linux distributions (docker)
        if: runner.os == 'Linux'
        run: v2/harness/scripts/test-install-distros.sh

  build:
    needs: install-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          # ubuntu-22.04 keeps the glibc floor at 2.35.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: v2/harness
    env:
      CARGO_TERM_COLOR: always
    steps:
      # Full history: build.rs stamps the commit that last touched assets/ (`git log -- assets`),
      # which a shallow clone would report as HEAD.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: host is the target
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "host $host, target ${{ matrix.target }}"
          test "$host" = "${{ matrix.target }}"
      - name: tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/harness-v')
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "harness-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != harness-v$version"; exit 1; }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2/harness
          key: release-${{ matrix.target }}
      - name: build
        run: cargo build --release --locked -p amp-harness
      - name: package
        run: |
          archive=$(scripts/package.sh --target ${{ matrix.target }} | tail -n 1)
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          cat "$archive.sha256"
      - name: install the archive with install.sh and run it
        run: |
          ./install.sh --archive "$ARCHIVE" --prefix "$RUNNER_TEMP/bin" --no-path-check
          "$RUNNER_TEMP/bin/amp-harness" --version
      # The installed binary must report the crate version and this exact, clean commit.
      - name: version stamp
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          out=$("$RUNNER_TEMP/bin/amp-harness" --version)
          first=$(printf '%s\n' "$out" | head -n 1)
          test "$first" = "amp-harness $version" || { echo "::error::first line '$first', want 'amp-harness $version'"; exit 1; }
          commit=$(printf '%s\n' "$out" | sed -n 's/^commit //p')
          head=$(git rev-parse HEAD)
          case "$commit" in
            *-dirty|unknown|"") echo "::error::build commit stamp is '$commit'"; exit 1 ;;
          esac
          case "$head" in
            "$commit"*) echo "stamped commit $commit = HEAD $head" ;;
            *) echo "::error::stamped commit $commit is not HEAD $head"; exit 1 ;;
          esac
          assets=$(printf '%s\n' "$out" | sed -n 's/^assets //p')
          want=$(git log -1 --format=%h -- assets)
          test "$assets" = "$want" || { echo "::error::assets stamp '$assets', want '$want'"; exit 1; }
          for pin in rpi-ai rpi-agent rpi-tools rpi-harness rpi-tui rmcp; do
            printf '%s\n' "$out" | grep -q "^$pin [0-9]" || { echo "::error::no $pin pin in --version"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: amp-harness-${{ matrix.target }}
          path: |
            v2/harness/target/dist/*.tar.gz
            v2/harness/target/dist/*.tar.gz.sha256
          if-no-files-found: error

  # All four archives together: SHA256SUMS and the rendered Homebrew formula (proves the formula
  # template covers every target). M5-1's publish job starts from this artifact.
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: amp-harness-*
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum -c ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS
      - name: Homebrew formula
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' v2/harness/Cargo.toml | head -n 1)
          v2/harness/scripts/render-formula.sh "$version" dist > dist/amp-harness.rb
          ruby -c dist/amp-harness.rb
          cp v2/harness/install.sh dist/install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: harness-release
          path: dist/
          if-no-files-found: error

  # harness-v* tags only: the tagged commit must have passed `Harness` and `Harness smoke`. Fails
  # closed: no successful run of either workflow on GITHUB_SHA, or an API error, fails the job and
  # so blocks `publish`. Runs alongside install-test/build; only publish waits on it.
  gate:
    if: startsWith(github.ref, 'refs/tags/harness-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Harness and Harness smoke passed on the tagged commit
        run: |
          version=${TAG#harness-v}
          case "$version" in
            *-test*) echo "$TAG is a -test version (draft dry run on an off-branch commit): gate skipped"; exit 0 ;;
          esac
          failed=0
          for wf in harness.yml harness-smoke.yml; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq .total_count) || n=""
            case "$n" in
              ''|*[!0-9]*)
                echo "::error::could not list $wf runs for $GITHUB_SHA (got '$n')"
                failed=1 ;;
              0)
                echo "::error::$wf has no successful run on $GITHUB_SHA. Run it on the tag: gh workflow run $wf --ref $TAG, wait for it to pass, then re-run this release run: gh run rerun $GITHUB_RUN_ID --failed"
                failed=1 ;;
              *)
                echo "$wf: $n successful run(s) on $GITHUB_SHA" ;;
            esac
          done
          exit "$failed"

  # harness-v* tags only: the GitHub Release. Uses GITHUB_TOKEN (no extra secrets). Needs `gate`.
  publish:
    if: startsWith(github.ref, 'refs/tags/harness-v')
    needs: [package, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: harness-release
          path: dist
      - name: verify the release files
        working-directory: dist
        run: |
          ls -l
          sha256sum -c SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          test -s install.sh && test -s amp-harness.rb
      - name: create the GitHub Release
        run: |
          version=${TAG#harness-v}
          flags="--latest=false"
          case "$version" in
            *-test*) flags="$flags --draft --prerelease" ;;
            *-*) flags="$flags --prerelease" ;;
          esac
          cat > notes.md <<EOF
          amp-harness $version, built from ${GITHUB_SHA}.

          Install or upgrade (macOS and Linux, no sudo):

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/main/v2/harness/install.sh | sh -s -- --version $version
          \`\`\`

          Each archive has a .sha256 next to it, and SHA256SUMS lists all four. \`amp-harness --version\` reports the rpi/rmcp pins, the embedded assets commit and the build commit. Not signed (v1). amp-harness.rb is the rendered Homebrew formula, for a tap.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists: replacing its files"
            gh release upload "$TAG" dist/* --clobber
          else
            # shellcheck disable=SC2086 # flags is a word list
            gh release create "$TAG" dist/* --verify-tag --title "amp-harness $version" --notes-file notes.md $flags
          fi
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,assets --jq '{tagName,isDraft,isPrerelease,url,assets:[.assets[].name]}'

      # Homebrew tap (template, Q4: no tap repo yet). When one exists: add a deploy key or a
      # fine-grained token as a secret, check out the tap, copy dist/amp-harness.rb to
      # Formula/amp-harness.rb and push. Skipped for prereleases.
      - name: Homebrew tap (template, not wired)
        if: ${{ !contains(github.ref_name, '-') }}
        run: echo "No Homebrew tap yet; amp-harness.rb is attached to the release."
