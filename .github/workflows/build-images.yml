name: Build & push AMP images

# Builds the four AMP v2 service images and pushes them to GHCR
# (ghcr.io/<owner>/amp/<component>). The Helm chart's values-prod.yaml
# points image.registry at this same path.
#
# Tags pushed per build:
#   - <git-sha-short>        always
#   - latest                 only on pushes to main
#   - <tag>                  when the trigger is a git tag (e.g. v1.2.3)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "v2/amp-api/**"
      - "v2/ui/**"
      - "v2/certs/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/amp

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: amp-api
            dockerfile: v2/amp-api/Dockerfile
          - component: amp-authadmin
            dockerfile: v2/amp-api/Dockerfile.authadmin
          - component: amp-mcpoauth
            dockerfile: v2/amp-api/Dockerfile.mcpoauth
          - component: amp-asynqmon-gate
            dockerfile: v2/amp-api/Dockerfile.asynqmongate
          - component: amp-ui
            dockerfile: v2/ui/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.component }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: v2
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
