name: Test amp-api

# Runs vet + the full amp-api test suite (unit, MCP transport over real HTTP
# in both protocol eras, OAuth broker, and the Postgres-backed integration
# tests) on every PR and on main. The e2e suite in test/e2e needs a deployed
# stack and is run manually — see v2/docs/deploy-architecture.md.

on:
  pull_request:
    paths:
      - "v2/amp-api/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "v2/amp-api/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amp
          POSTGRES_PASSWORD: amp
          POSTGRES_DB: amp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: v2/amp-api
    env:
      TEST_DATABASE_URL: postgres://amp:amp@localhost:5432/amp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: v2/amp-api/go.mod
          cache-dependency-path: v2/amp-api/go.sum
      - name: go vet
        run: go vet ./... && go vet -tags e2e ./test/e2e/
      - name: go test (race)
        run: go test -race -count=1 ./...
