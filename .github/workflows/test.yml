name: Test amp-api

# Runs vet + the full amp-api test suite (unit, MCP transport over real HTTP
# in both protocol eras, OAuth broker, and the Postgres- and Typesense-backed
# integration tests; Valkey for the queued KB write path) on every PR and on main and the
# milestone integration branches (harness-m*, remote-m*). The e2e suite in test/e2e needs a deployed
# stack and is run manually — see v2/docs/deploy-architecture.md.

on:
  pull_request:
    paths:
      - "v2/amp-api/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main, "harness-m*", "remote-m*"]
    paths:
      - "v2/amp-api/**"
      - ".github/workflows/test.yml"
  # manual run, e.g. to confirm a milestone branch head is green when no path filter fired
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amp
          POSTGRES_PASSWORD: amp
          POSTGRES_DB: amp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      typesense:
        image: typesense/typesense:30.1
        env:
          TYPESENSE_API_KEY: test
          TYPESENSE_DATA_DIR: /tmp
        ports: ["8108:8108"]
      # Valkey backs the asynq queue the KB write path uses when REDIS_ADDR
      # is set; tests read TEST_REDIS_ADDR to exercise the queued path.
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: v2/amp-api
    env:
      TEST_DATABASE_URL: postgres://amp:amp@localhost:5432/amp_test?sslmode=disable
      TEST_TYPESENSE_URL: http://localhost:8108
      TEST_TYPESENSE_KEY: test
      TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: v2/amp-api/go.mod
          cache-dependency-path: v2/amp-api/go.sum
      - name: wait for typesense
        run: timeout 60 bash -c 'until curl -sf localhost:8108/health | grep -q "\"ok\":true"; do sleep 1; done'
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./... && go vet -tags e2e ./test/e2e/
      - name: go test (race)
        run: go test -race -count=1 ./...
      - name: go test across replicas (every MCP test through a forwarding replica)
        run: TEST_CLUSTER=1 go test -race -count=1 ./cmd/server
