name: Harness smoke

# Compatibility CI across MCP protocol eras (AMP KB decisions/amp-harness-architecture.md, D2/D13;
# ticket M5-2, #2123). Starts the docker compose AMP stack (v2/docker-compose.yml: auth off, so the
# harness acts as local-dev@amp.local) and runs `make -C v2/harness smoke` once per protocol mode:
#
#   auto        Auto negotiation, which must land on the stateless 2026-07-28 era (smoke asserts it).
#               This mode also runs the config, firstrun and install legs, which always use auto.
#   2026-07-28  forced new era, compose leg only.
#   2025-11-25  forced legacy era, compose leg only.
#
# Keyless: the smoke drives the manager and workers with scripted faux models, and the firstrun and
# install legs use a made-up provider key that is never sent anywhere. The cluster leg is left out
# (it needs a person's amp_ token), so no repo secret is used. Ollama is not started: the smoke never
# searches the KB, and its image is several GB.

on:
  pull_request:
    paths:
      - "v2/harness/**"
      - "v2/amp-api/**"
      - "v2/ui/**"
      - "v2/kb/**"
      - "v2/docker-compose.yml"
      - ".github/workflows/harness-smoke.yml"
  push:
    branches: [main, "harness-m*", "remote-m*"]
    paths:
      - "v2/harness/**"
      - "v2/amp-api/**"
      - "v2/ui/**"
      - "v2/kb/**"
      - "v2/docker-compose.yml"
      - ".github/workflows/harness-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (${{ matrix.protocol }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - protocol: auto
            legs: compose config firstrun install
          - protocol: "2026-07-28"
            legs: compose
          - protocol: "2025-11-25"
            legs: compose
    env:
      CARGO_TERM_COLOR: always
      COMPOSE_PROJECT_NAME: amp-smoke
    steps:
      - uses: actions/checkout@v4

      # `make build` (--all-targets) plus the amp-api and ui images don't fit the runner's free disk.
      - name: free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Build the stack's images in the background while cargo builds the harness.
      - name: build the compose AMP stack (background)
        working-directory: v2
        run: |
          nohup docker compose -f docker-compose.yml build amp-api ui >"$RUNNER_TEMP/compose-build.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/compose-build.pid"

      - name: install toolchain from rust-toolchain.toml
        working-directory: v2/harness
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2/harness
          # one cache for all three modes: they build the same thing
          shared-key: harness-smoke
      - name: build the harness
        run: make -C v2/harness build

      - name: start the compose AMP stack
        working-directory: v2
        run: |
          pid="$(cat "$RUNNER_TEMP/compose-build.pid")"
          while kill -0 "$pid" 2>/dev/null; do sleep 5; done
          tail -n 20 "$RUNNER_TEMP/compose-build.log"
          docker compose -f docker-compose.yml up -d postgres typesense amp-api ui
          # REST /ready, and any HTTP answer from the MCP listener. Probe MCP with a POST: a GET on
          # /mcp opens the Streamable HTTP event stream and never returns.
          for i in $(seq 1 60); do
            code="$(curl -sS -m 5 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d '{}' http://localhost:8000/mcp 2>/dev/null || true)"
            # /ready is 503 while the replica can't heartbeat: require it three times in a row (~6s,
            # longer than one heartbeat interval) so a stalled server fails here, not mid-smoke.
            if curl -fsS -m 5 http://localhost:3001/ready >/dev/null 2>&1 && [ "${code:-000}" != 000 ]; then
              ok=$((${ok:-0} + 1))
              if [ "$ok" -ge 3 ]; then echo "AMP is up (try $i, MCP answered $code)"; exit 0; fi
            else
              ok=0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --tail 100 amp-api
          exit 1

      - name: make smoke (${{ matrix.protocol }})
        env:
          AMP_MCP_URL: http://localhost:8000/mcp
          AMP_SMOKE_REST_URL: http://localhost:3001
          AMP_SMOKE_WEB_URL: http://localhost:5173
          AMP_SMOKE_PROTOCOLS: ${{ matrix.protocol }}
          AMP_SMOKE_LEGS: ${{ matrix.legs }}
        run: make -C v2/harness smoke

      - name: amp-api logs
        if: failure()
        working-directory: v2
        run: |
          cat "$RUNNER_TEMP/compose-build.log" | tail -n 60 || true
          docker compose -f docker-compose.yml ps || true
          docker compose -f docker-compose.yml logs --tail 300 amp-api || true

      - name: stop the stack
        if: always()
        working-directory: v2
        run: docker compose -f docker-compose.yml down -v || true
