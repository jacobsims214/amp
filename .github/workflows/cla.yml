# Contributor License Agreement check (CLA.md). Contributors sign once by
# commenting on their pull request; signatures are stored on the
# cla-signatures branch. Runs on pull_request_target without checking out
# the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA check
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # contributor-assistant/github-action v2.6.1, pinned by commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/jacobsims214/amp/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The maintainer owns the copyright already; bots don't sign. Nor do the
          # maintainer's own agents (amp-designer, amp-worker-backend, ...): they commit
          # as `amp-<role> <amp-<role>@localhost>`, which is not a GitHub account, so the
          # bot can neither allowlist it by name nor ask it to sign. The maintainer owns
          # their output, so the `amp-*` pattern covers the whole family. Patterns support
          # `*` (contributor-assistant/github-action, src/checkAllowList.ts).
          allowlist: jacobsims214,dependabot[bot],github-actions[bot],renovate[bot],amp-*
          lock-pullrequest-aftermerge: false
