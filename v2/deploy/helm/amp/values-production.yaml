## AMP Helm chart — datacenter (Talos/Proxmox) production values.
##
## Deployed via ArgoCD as an Application pointing at this chart directory,
## matching the existing `simstech-odoo`/`odoo-operator` convention in this
## cluster — see deploy/argocd/amp-application.yaml for the reference
## Application manifest (not applied automatically — review before
## registering it in ArgoCD).
##
## Manual/dev-loop usage (bypassing ArgoCD):
##   helm upgrade --install amp . -n amp --create-namespace \
##     -f values-production.yaml \
##     --set global.imageTag=sha-<shortsha>
##
## The GitHub Actions workflow (.github/workflows/build-images.yml) tags
## every build as both `latest` and `sha-<shortsha>` — pin to the sha tag
## for real deploys, don't run prod on a floating `latest` long-term.
##
## Verified against the live cluster (read-only exploration, nothing changed):
##   - cert-manager and the CNPG operator are already installed cluster-wide
##     (namespaces cert-manager, cnpg-system) — this chart does NOT install
##     either operator, only CRs, so no conflict.
##   - Storage: NFS-backed `nfs-storage` is the (and only) StorageClass,
##     already used successfully by several 3-instance CNPG clusters in this
##     cluster (immich-db, simstech-db, vault-postgres-cluster) — used below.
##   - Cilium L2Announcement (`service-pool` IP pool, `service-policy`) is
##     already handing out real routable VLAN IPs to LoadBalancer Services
##     (argocd-server, immich, cilium-ingress, simstech-odoo-lb, etc.) — same
##     mechanism Envoy's Service will use here.
##
## Still needs your input before first deploy:
##   - global.bootstrapAdminEmails — the real first-admin email
##   - typesense.apiKey — still the local-dev default, see TODO below
##   - CNPG backups — deliberately NOT configured yet (see bottom of this
##     file). Do not consider this production-ready for real user data until
##     that's wired up.

global:
  namespace: amp
  domain: amp.simstech.cloud

  # Your Proxmox SSL gateway terminates TLS before traffic reaches the
  # cluster (Cilium L2Announcement/BGP just gives Envoy's LoadBalancer
  # Service a routable IP on the VLAN — it doesn't do TLS itself). Envoy
  # therefore runs plain-HTTP-only here; see docs/deploy-architecture.md for
  # the full request path. Flip this to true (+ pick an issuer below) if you
  # ever move to a topology where Envoy itself should terminate TLS (e.g.
  # SNI passthrough instead of termination at the gateway).
  tls:
    enabled: false
    issuer: letsencrypt-dns01   # only consulted if enabled: true
    letsencrypt:
      email: "ops@simstech.cloud"
      dns01:
        provider: ""            # fill in the real cert-manager DNS-01 solver block for your DNS provider if/when tls.enabled flips to true

  # TODO: real first-admin email for this environment.
  bootstrapAdminEmails: "admin@simstech.cloud"

  # Pinned, pre-generated values — ArgoCD's Helm rendering does not
  # reliably support the lookup-based "reuse existing Secret value" trick
  # (verified empirically: consecutive syncs produced different random
  # values, desyncing Dex from oauth2-proxy until every consumer happened
  # to restart together). These specific values are already live and
  # working in the cluster as of 2026-07-27 — do not regenerate without
  # also restarting dex, oauth2-proxy, amp-valkey, amp-api, and
  # amp-asynqmon together. See templates/secrets.yaml and
  # docs/deploy-architecture.md.
  secretOverrides:
    oauth2ProxyClientSecret: "upXh5U8e6egfrDKOFwRdRMm0ZKSHgPFM55KZCdys"
    oauth2ProxyCookieSecret: "l3NAV1WayYMTPp32SNp5IfZ20I0W8xA8"
    valkeyPassword: "RmyzuBJHK2aSR06jUHMNWvCIoMDxnecy"

  # Single override point for every amp-* image tag — set this via ArgoCD's
  # Application `helm.parameters` (see deploy/argocd/amp-application.yaml),
  # matching how odoo-operator's Application overrides `image.tag`.
  imageTag: "latest"   # override per release, e.g. sha-763788d

image:
  # Built + pushed by .github/workflows/build-images.yml on every push to
  # main / tag. Namespace matches env.IMAGE_NAMESPACE in that workflow.
  registry: ghcr.io/jacobsims214/amp
  pullPolicy: IfNotPresent

ampApi:
  tag: ""   # empty = use global.imageTag
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

ui:
  tag: ""
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }

authAdmin:
  tag: ""
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }

mcpOAuth:
  tag: ""
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }

asynqmonGate:
  tag: ""

valkey:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

dex:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

oauth2Proxy:
  replicas: 2
  cookieSecure: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }

envoy:
  replicas: 2
  service:
    # Cilium L2Announcement hands this a real routable IP on the server VLAN
    # from the `service-pool` pool — same mechanism argocd-server/immich/etc
    # already use. Your SSL gateway targets that IP on httpPort.
    type: LoadBalancer
    httpPort: 80
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

typesense:
  # TODO: replace with a real generated secret reference before go-live —
  # this is still the local-dev default. Simplest path: create the Secret
  # out-of-band and switch templates/typesense.yaml to read from it (not yet
  # wired — flag if you want this done before first prod deploy).
  apiKey: amp-local-dev
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }
  storage:
    size: 10Gi
    storageClassName: nfs-storage

ollama:
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "4", memory: 4Gi }
  storage:
    size: 10Gi
    storageClassName: nfs-storage

cnpg:
  instances: 3   # HA — CNPG handles leader election + pod anti-affinity automatically.
                 # nfs-storage is already proven at 3 instances elsewhere in this
                 # cluster (immich-db, simstech-db, vault-postgres-cluster).
  storage:
    size: 20Gi
    storageClassName: nfs-storage
  # TODO — CNPG backups are NOT configured. Before this touches real data,
  # add something like the following (requires an S3-compatible endpoint —
  # MinIO on Proxmox, real S3, Backblaze B2, etc.) to templates/cnpg-cluster.yaml:
  #
  #   backup:
  #     barmanObjectStore:
  #       destinationPath: s3://amp-backups/
  #       endpointURL: https://minio.simstech.cloud
  #       s3Credentials:
  #         accessKeyId: { name: amp-backup-creds, key: ACCESS_KEY_ID }
  #         secretAccessKey: { name: amp-backup-creds, key: SECRET_ACCESS_KEY }
  #     scheduledBackups:
  #       - name: daily-backup
  #         schedule: "0 0 3 * * *"
  #         backupOwnerReference: self

postInstall:
  pullEmbeddingModel: true
