## AMP Helm chart — datacenter (Talos/Proxmox) production values.
##
## Deployed via ArgoCD as an Application pointing at this chart directory,
## matching the existing `simstech-odoo`/`odoo-operator` convention in this
## cluster — see deploy/argocd/amp-application.yaml for the reference
## Application manifest (not applied automatically — review before
## registering it in ArgoCD).
##
## Manual/dev-loop usage (bypassing ArgoCD):
##   helm upgrade --install amp . -n amp --create-namespace \
##     -f values-production.yaml \
##     --set global.imageTag=sha-<shortsha>
##
## The GitHub Actions workflow (.github/workflows/build-images.yml) tags
## every build as both `latest` and `sha-<shortsha>` — pin to the sha tag
## for real deploys, don't run prod on a floating `latest` long-term.
##
## Verified against the live cluster (read-only exploration, nothing changed):
##   - cert-manager and the CNPG operator are already installed cluster-wide
##     (namespaces cert-manager, cnpg-system) — this chart does NOT install
##     either operator, only CRs, so no conflict.
##   - Storage: NFS-backed `nfs-storage` is the (and only) StorageClass,
##     already used successfully by several 3-instance CNPG clusters in this
##     cluster (immich-db, simstech-db, vault-postgres-cluster) — used below.
##   - Cilium L2Announcement (`service-pool` IP pool, `service-policy`) is
##     already handing out real routable VLAN IPs to LoadBalancer Services
##     (argocd-server, immich, cilium-ingress, simstech-odoo-lb, etc.) — same
##     mechanism Envoy's Service will use here.
##
## Still needs your input before first deploy:
##   - global.bootstrapAdminEmails — the real first-admin email
##   - typesense.apiKey — still the local-dev default, see TODO below
##   - CNPG backups — deliberately NOT configured yet (see bottom of this
##     file). Do not consider this production-ready for real user data until
##     that's wired up.

global:
  namespace: amp
  domain: amp.simstech.cloud

  # Your Proxmox SSL gateway terminates TLS before traffic reaches the
  # cluster (Cilium L2Announcement/BGP just gives Envoy's LoadBalancer
  # Service a routable IP on the VLAN — it doesn't do TLS itself). Envoy
  # therefore runs plain-HTTP-only here; see docs/deploy-architecture.md for
  # the full request path. Flip this to true (+ pick an issuer below) if you
  # ever move to a topology where Envoy itself should terminate TLS (e.g.
  # SNI passthrough instead of termination at the gateway).
  tls:
    enabled: false
    issuer: letsencrypt-dns01   # only consulted if enabled: true
    letsencrypt:
      email: "ops@simstech.cloud"
      dns01:
        provider: ""            # fill in the real cert-manager DNS-01 solver block for your DNS provider if/when tls.enabled flips to true

  # TODO: real first-admin email for this environment.
  bootstrapAdminEmails: "admin@simstech.cloud"

  # Pinned, pre-generated values — ArgoCD's Helm rendering does not
  # reliably support the lookup-based "reuse existing Secret value" trick
  # (verified empirically: consecutive syncs produced different random
  # values, desyncing Dex from oauth2-proxy until every consumer happened
  # to restart together). These specific values are already live and
  # working in the cluster as of 2026-07-27 — do not regenerate without
  # also restarting dex, oauth2-proxy, amp-valkey, amp-api, and
  # amp-asynqmon together. See templates/secrets.yaml and
  # docs/deploy-architecture.md.
  secretOverrides:
    oauth2ProxyClientSecret: "upXh5U8e6egfrDKOFwRdRMm0ZKSHgPFM55KZCdys"
    oauth2ProxyCookieSecret: "l3NAV1WayYMTPp32SNp5IfZ20I0W8xA8"
    valkeyPassword: "RmyzuBJHK2aSR06jUHMNWvCIoMDxnecy"
    # Pinned 2026-07-28 after discovering the amp-bootstrap-admin Secret's
    # password was regenerating on every ArgoCD sync (same lookup-through-
    # ArgoCD unreliability as the other secrets above, just never migrated
    # to this pattern before) — see discoveries/bootstrap-admin-password-drift.md.
    bootstrapAdminPassword: "CFvwuybvOIq8dL9eldva"

  # Single override point for every amp-* image tag — set this via ArgoCD's
  # Application `helm.parameters` (see deploy/argocd/amp-application.yaml),
  # matching how odoo-operator's Application overrides `image.tag`.
  imageTag: "latest"   # override per release, e.g. sha-763788d

# Client IP in the audit log (#2430, #2469). See values.yaml for what these
# mean. The services believe the client address Envoy sends only from
# Envoy's pods, which run in this cluster's pod CIDR; the networkPolicy
# below keeps every other pod away from the services.
# envoy.clientIP stays at the chart default (xffNumTrustedHops: 0): rows
# record Envoy's TCP peer, which is whatever proxy sits in front of Envoy
# here. Not spoofable, but not the end client either. To record the end
# client, describe the hops in front of Envoy (envoy.clientIP) once they pass
# it on: an operator choice, see the release notes (#2436).
clientIP:
  trustedProxies:
    - 10.244.0.0/16

networkPolicy:
  enabled: true
  # Who may reach Envoy is left open (the chart default). With
  # envoy.clientIP.xffNumTrustedHops at 0 nothing in front of Envoy can
  # choose its recorded address, so this isn't needed for the audit log.
  envoyIngress:
    enabled: false

image:
  # Built + pushed by .github/workflows/build-images.yml on every push to
  # main / tag. Namespace matches env.IMAGE_NAMESPACE in that workflow.
  registry: ghcr.io/jacobsims214/amp
  pullPolicy: IfNotPresent

ampApi:
  tag: ""   # empty = use global.imageTag
  replicas: 1
  # Audit checkpoint signing key (#2439 H2). The Secret's value is never in
  # git. Create it once, before this chart version reaches prod:
  #   amp-api audit keygen -out signing-key   # prints the public key and key id: keep a copy off-box
  #   kubectl -n amp create secret generic amp-audit-signing --from-file=signing-key=signing-key
  #   rm signing-key
  # The reference is optional: until the Secret exists amp-api starts without
  # a key, checkpoints are unsigned and /api/audit/verify says "unproven".
  audit:
    signingKey:
      existingSecret: amp-audit-signing
  # Webhook auth headers and signing secrets are encrypted at rest with the
  # key in this Secret (#2441). Its value is never in git. Create it once:
  #   openssl rand -base64 32 | tr -d '\n' > encryption-key   # keep a copy off-box
  #   kubectl -n amp create secret generic amp-secrets-encryption --from-file=encryption-key=encryption-key
  #   rm encryption-key
  # The reference is optional: until the Secret exists amp-api starts without
  # a key, and webhook auth headers can't be added.
  secretsEncryption:
    existingSecret: amp-secrets-encryption
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# amp-relay (remote control, epic 165). Its image is built by
# build-images.yml like the others. Turning the relay off (enabled: false) is
# a pause, not an end: sessions stay active and resume when it is back.
relay:
  enabled: true
  tag: ""   # empty = use global.imageTag
  # ArgoCD can't keep the chart's lookup-or-random secrets stable (see
  # secretOverrides above), so the relay's database password and cluster
  # token come from Secrets created by hand in namespace amp (#2470). Copies
  # are kept off the cluster. The chart refuses to render with the relay on
  # unless both are pinned.
  requirePinnedSecrets: true
  database:
    # kubernetes.io/basic-auth: username amp_relay, password (URL-safe: it
    # goes into DATABASE_URL). Labelled cnpg.io/reload=true, so CloudNativePG
    # sets the managed role's password from it and follows a rotation.
    existingSecret: amp-relay-db
  clusterToken:
    # Opaque, key "token" (32+ random characters). Mounted in amp-relay and
    # amp-api as RELAY_CLUSTER_TOKEN; amp-api's own cluster token stays in
    # the database.
    existingSecret: amp-relay-cluster-token

ui:
  tag: ""
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }

authAdmin:
  tag: ""
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }

mcpOAuth:
  tag: ""
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }

asynqmonGate:
  tag: ""

valkey:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

dex:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

oauth2Proxy:
  # Single replica: with 2 replicas and no shared session-store locking,
  # concurrent token refreshes race — one redeems the rotating refresh token,
  # the other fails with "Refresh token is invalid or has already been
  # claimed by another client", periodically killing the browser session.
  # This limitation is oauth2-proxy's own: amp-api no longer has one (since
  # cluster mode, any number of amp-api replicas is safe and its single
  # replica is a choice; see architecture/clustering.md). See
  # discoveries/prod-diagnostic-2026-08-02.md.
  replicas: 1
  cookieSecure: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }

envoy:
  replicas: 2
  service:
    # Now behind Traefik — changed to ClusterIP. Traefik routes amp.simstech.cloud -> envoy:80
    type: ClusterIP
    httpPort: 80
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

typesense:
  # TODO: replace with a real generated secret reference before go-live —
  # this is still the local-dev default. Simplest path: create the Secret
  # out-of-band and switch templates/typesense.yaml to read from it (not yet
  # wired — flag if you want this done before first prod deploy).
  apiKey: amp-local-dev
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }
  storage:
    size: 10Gi
    storageClassName: nfs-storage

ollama:
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "4", memory: 4Gi }
  storage:
    size: 10Gi
    storageClassName: nfs-storage

cnpg:
  instances: 3   # HA — CNPG handles leader election + pod anti-affinity automatically.
                 # nfs-storage is already proven at 3 instances elsewhere in this
                 # cluster (immich-db, simstech-db, vault-postgres-cluster).
  storage:
    size: 20Gi
    storageClassName: nfs-storage
  # TODO — CNPG backups are NOT configured. Before this touches real data,
  # add something like the following (requires an S3-compatible endpoint —
  # MinIO on Proxmox, real S3, Backblaze B2, etc.) to templates/cnpg-cluster.yaml:
  #
  #   backup:
  #     barmanObjectStore:
  #       destinationPath: s3://amp-backups/
  #       endpointURL: https://minio.simstech.cloud
  #       s3Credentials:
  #         accessKeyId: { name: amp-backup-creds, key: ACCESS_KEY_ID }
  #         secretAccessKey: { name: amp-backup-creds, key: SECRET_ACCESS_KEY }
  #     scheduledBackups:
  #       - name: daily-backup
  #         schedule: "0 0 3 * * *"
  #         backupOwnerReference: self

postInstall:
  pullEmbeddingModel: true
