apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cnpg.clusterName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "amp.componentLabels" (dict "component" "postgres" "Release" .Release) | nindent 4 }}
spec:
  instances: {{ .Values.cnpg.instances }}
  imageName: ghcr.io/cloudnative-pg/postgresql:{{ .Values.cnpg.postgresVersion }}
  primaryUpdateStrategy: unsupervised
  storage:
    size: {{ .Values.cnpg.storage.size }}
    {{- if .Values.cnpg.storage.storageClassName }}
    storageClass: {{ .Values.cnpg.storage.storageClassName }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.cnpg.appDatabase }}
      owner: {{ .Values.cnpg.appOwner }}
  monitoring:
    enablePodMonitor: false
  {{- if .Values.relay.enabled }}
  # amp-relay's own login role (#2392). CloudNativePG creates it and keeps its
  # password in step with the Secret; amp-api (which owns the tables) grants
  # it only what the relay uses, after migrating (RELAY_DB_ROLE).
  #
  # Only fields that differ from CNPG's defaults, or that CNPG stores as
  # given, are written (#2474). superuser, createdb, createrole, replication
  # and bypassrls are plain omitempty booleans in CNPG's API: `false` is
  # already the default and is dropped when the Cluster is stored, so writing
  # it makes a GitOps diff (ArgoCD) never match and re-apply forever. inherit
  # is a pointer defaulting to true, so its `false` is kept and stored.
  managed:
    roles:
      - name: {{ .Values.relay.database.role }}
        ensure: present
        comment: amp-relay (remote control relay), least privilege
        login: true
        inherit: false
        connectionLimit: 20
        passwordSecret:
          name: {{ include "amp.relayDbSecret" . }}
  {{- end }}
---
# Dex gets its own database in the same cluster, owned by the same app role —
# this is a small, single-tenant-trust stack so one role owning two databases
# is an acceptable simplification. Split this out with its own Role if you
# need tighter isolation later.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: amp-dex-db
  namespace: {{ .Values.global.namespace }}
spec:
  name: dex
  owner: {{ .Values.cnpg.appOwner }}
  cluster:
    name: {{ .Values.cnpg.clusterName }}
  databaseReclaimPolicy: retain
