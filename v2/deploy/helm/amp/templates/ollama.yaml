apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "amp.componentLabels" (dict "component" "ollama" "Release" .Release) | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      securityContext:
        {{- include "amp.podSecurityContext" (dict "fsGroup" 1000) | nindent 8 }}
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          securityContext:
            {{- include "amp.chownInitSecurityContext" . | nindent 12 }}
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}:{{ .Values.ollama.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 1000) | nindent 12 }}
          env:
            # Upstream default is $HOME/.ollama (root's home when running as
            # root). Running as a non-root UID needs both redirected to a
            # path our PVC actually owns.
            - name: HOME
              value: /data
            - name: OLLAMA_MODELS
              value: /data/models
          ports:
            - name: http
              containerPort: 11434
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: {{ .Values.global.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.ollama.storage.storageClassName }}
  storageClassName: {{ .Values.ollama.storage.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ollama.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
