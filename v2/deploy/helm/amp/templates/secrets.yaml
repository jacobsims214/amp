{{/*
  Stable secret values.

  The lookup-based "reuse the existing Secret's value" trick below works
  reliably with plain `helm upgrade` (has live cluster access at template
  time) but is NOT reliable through ArgoCD's Helm rendering — verified
  empirically: two consecutive ArgoCD syncs of the exact same chart
  produced two different random secret values, because pods that didn't
  happen to restart in a given sync kept their OLD env var value while the
  Secret object itself got a NEW one, breaking Dex<->oauth2-proxy auth
  (mismatched client secret) until every consumer happened to restart
  together. See docs/deploy-architecture.md.

  Fix: global.secretOverrides lets values-production.yaml pin real,
  pre-generated values so there's no template-time randomness to race at
  all in that environment. Local dev (values.yaml) leaves these empty and
  keeps the lookup-or-random fallback, which is fine there since we always
  deploy locally via plain `helm upgrade`.
*/}}
{{- $ns := .Values.global.namespace }}
{{- $overrides := .Values.global.secretOverrides | default dict }}
{{- $secretName := "amp-oauth2-proxy" }}
{{- $o2pExisting := .Values.oauth2Proxy.existingSecret }}
{{- if eq $o2pExisting $secretName }}
{{- fail "oauth2Proxy.existingSecret must not be amp-oauth2-proxy: the chart owns that Secret; use another name" }}
{{- end }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $clientSecret := "" }}
{{- $cookieSecret := "" }}
{{- if $overrides.oauth2ProxyClientSecret }}
{{- $clientSecret = $overrides.oauth2ProxyClientSecret }}
{{- else if $existing }}
{{- $clientSecret = index $existing.data "client-secret" | b64dec }}
{{- else }}
{{- $clientSecret = randAlphaNum 40 }}
{{- end }}
{{- if $overrides.oauth2ProxyCookieSecret }}
{{- $cookieSecret = $overrides.oauth2ProxyCookieSecret }}
{{- else if $existing }}
{{- $cookieSecret = index $existing.data "cookie-secret" | b64dec }}
{{- else }}
{{- $cookieSecret = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ .Values.oauth2Proxy.clientID }}
  {{- if not $o2pExisting }}
  client-secret: {{ $clientSecret }}
  cookie-secret: {{ $cookieSecret }}
  {{- end }}
---
{{- if .Values.valkey.enabled }}
{{- $valkeySecretName := "amp-valkey-users" }}
{{- $existingValkey := lookup "v1" "Secret" $ns $valkeySecretName }}
{{- $valkeyPassword := "" }}
{{- if $overrides.valkeyPassword }}
{{- $valkeyPassword = $overrides.valkeyPassword }}
{{- else if $existingValkey }}
{{- $valkeyPassword = index $existingValkey.data "default" | b64dec }}
{{- else }}
{{- $valkeyPassword = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $valkeySecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
type: Opaque
stringData:
  default: {{ $valkeyPassword }}
{{- end }}
{{- if .Values.relay.enabled }}
{{- /*
  amp-relay's least-privilege database role (#2392): its password, in the
  basic-auth Secret CloudNativePG reads for the managed role (cnpg-cluster.yaml)
  and amp-relay reads to connect. Same lookup-or-random as above; pin
  global.secretOverrides.relayDbPassword or use relay.database.existingSecret
  under ArgoCD.
*/}}
{{- /*
  relay.requirePinnedSecrets (values-production.yaml sets it, #2399): under
  ArgoCD the lookup-or-random values below change on every sync, which would
  rotate the role's password and the cluster token under running pods. Refuse
  to render until both are pinned.
*/}}
{{- if .Values.relay.requirePinnedSecrets }}
{{- if not (or .Values.relay.database.existingSecret $overrides.relayDbPassword) }}
{{- fail "relay.enabled with relay.requirePinnedSecrets: set relay.database.existingSecret (a basic-auth Secret, username amp_relay) or global.secretOverrides.relayDbPassword; a generated password would change on every ArgoCD sync" }}
{{- end }}
{{- if not (or .Values.relay.clusterToken.existingSecret $overrides.relayClusterToken) }}
{{- fail "relay.enabled with relay.requirePinnedSecrets: set relay.clusterToken.existingSecret or global.secretOverrides.relayClusterToken; a generated token would change on every ArgoCD sync" }}
{{- end }}
{{- end }}
{{- if not .Values.relay.database.existingSecret }}
{{- $relayDbName := "amp-relay-db" }}
{{- $existingRelayDb := lookup "v1" "Secret" $ns $relayDbName }}
{{- $relayDbPassword := "" }}
{{- if $overrides.relayDbPassword }}
{{- $relayDbPassword = $overrides.relayDbPassword }}
{{- else if $existingRelayDb }}
{{- $relayDbPassword = index $existingRelayDb.data "password" | b64dec }}
{{- else }}
{{- $relayDbPassword = randAlphaNum 40 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $relayDbName }}
  namespace: {{ $ns }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.relay.database.role }}
  password: {{ $relayDbPassword }}
{{- end }}
{{- /*
  amp-relay's own cluster token (#2392): relay replicas and amp-api's calls
  to them (/internal/relay/) use it; amp-api's own cluster token stays in the
  database, out of the relay's reach.
*/}}
{{- if not .Values.relay.clusterToken.existingSecret }}
{{- $relayTokName := "amp-relay-cluster-token" }}
{{- $existingRelayTok := lookup "v1" "Secret" $ns $relayTokName }}
{{- $relayTok := "" }}
{{- if $overrides.relayClusterToken }}
{{- $relayTok = $overrides.relayClusterToken }}
{{- else if $existingRelayTok }}
{{- $relayTok = index $existingRelayTok.data .Values.relay.clusterToken.key | b64dec }}
{{- else }}
{{- $relayTok = randAlphaNum 48 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $relayTokName }}
  namespace: {{ $ns }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.relay.clusterToken.key }}: {{ $relayTok }}
{{- end }}
{{- end }}
