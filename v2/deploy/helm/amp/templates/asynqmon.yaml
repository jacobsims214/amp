{{- if .Values.valkey.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amp-asynqmon
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "amp.componentLabels" (dict "component" "asynqmon" "Release" .Release) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amp-asynqmon
  template:
    metadata:
      labels:
        app: amp-asynqmon
    spec:
      securityContext:
        {{- include "amp.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 65534) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.cnpg.clusterName }}-rw 5432; do echo waiting for postgres; sleep 3; done
        - name: wait-for-valkey
          image: busybox:1.36
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 65534) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until nc -z amp-valkey 6379; do echo waiting for valkey; sleep 3; done
      containers:
        # asynqmon itself has no auth — it's only reachable via the gate
        # sidecar below (localhost-only, no containerPort exposed on the
        # Service). See docs/deploy-architecture.md.
        - name: asynqmon
          image: {{ .Values.asynqmon.image }}:{{ .Values.asynqmon.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 1000) | nindent 12 }}
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_ADDR
              value: "amp-valkey.{{ .Values.global.namespace }}.svc.cluster.local:6379"
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: amp-valkey-users, key: default } }
          resources:
            {{- toYaml .Values.asynqmon.resources | nindent 12 }}
        - name: gate
          image: {{ include "amp.image" (dict "image" .Values.asynqmonGate.image "tag" .Values.asynqmonGate.tag "root" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "amp.containerSecurityContext" . | nindent 12 }}
          env:
            - name: PGHOST
              value: "{{ .Values.cnpg.clusterName }}-rw.{{ .Values.global.namespace }}.svc.cluster.local"
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: {{ .Values.cnpg.clusterName }}-app, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.cnpg.clusterName }}-app, key: password } }
            - name: DATABASE_URL
              value: "postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/{{ .Values.cnpg.appDatabase }}?sslmode=require"
            - name: ADDR
              value: ":8092"
            - name: ASYNQMON_ADDR
              value: "127.0.0.1:8080"
            - name: OIDC_ISSUER_URL
              value: "https://{{ .Values.global.domain }}/dex"
            - name: OIDC_DISCOVERY_URL
              value: "http://dex.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.dex.httpPort }}/dex"
            - name: BOOTSTRAP_ADMIN_EMAILS
              value: {{ .Values.global.bootstrapAdminEmails | quote }}
          ports:
            - name: http
              containerPort: 8092
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.asynqmonGate.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: amp-asynqmon
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: amp-asynqmon
  ports:
    # Only the gate's port is exposed — asynqmon itself is reachable only
    # from within the pod (localhost), never directly.
    - name: http
      port: 8092
      targetPort: http
{{- end }}
