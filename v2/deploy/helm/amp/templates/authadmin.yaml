apiVersion: apps/v1
kind: Deployment
metadata:
  name: amp-authadmin
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "amp.componentLabels" (dict "component" "authadmin" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.authAdmin.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: amp-authadmin
  template:
    metadata:
      labels:
        app: amp-authadmin
    spec:
      securityContext:
        {{- include "amp.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: wait-for-dex-grpc
          image: busybox:1.36
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 65534) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until nc -z dex-grpc {{ .Values.dex.grpcPort }}; do echo waiting for dex-grpc; sleep 3; done
      containers:
        - name: amp-authadmin
          image: {{ include "amp.image" (dict "image" .Values.authAdmin.image "tag" .Values.authAdmin.tag "root" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "amp.containerSecurityContext" . | nindent 12 }}
          env:
            - name: PGHOST
              value: "{{ .Values.cnpg.clusterName }}-rw.{{ .Values.global.namespace }}.svc.cluster.local"
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: {{ .Values.cnpg.clusterName }}-app, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.cnpg.clusterName }}-app, key: password } }
            - name: DATABASE_URL
              value: "postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/{{ .Values.cnpg.appDatabase }}?sslmode=require"
            - name: ADDR
              value: ":8090"
            - name: OIDC_ISSUER_URL
              value: "https://{{ .Values.global.domain }}/dex"
            - name: OIDC_DISCOVERY_URL
              value: "http://dex.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.dex.httpPort }}/dex"
            - name: BOOTSTRAP_ADMIN_EMAILS
              value: {{ .Values.global.bootstrapAdminEmails | quote }}
            - name: DEX_GRPC_ADDR
              value: "dex-grpc.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.dex.grpcPort }}"
            - name: DEX_GRPC_CA_CERT
              value: /etc/dex-grpc-tls/ca.crt
            - name: DEX_GRPC_CLIENT_CERT
              value: /etc/dex-grpc-tls/tls.crt
            - name: DEX_GRPC_CLIENT_KEY
              value: /etc/dex-grpc-tls/tls.key
          ports:
            - name: http
              containerPort: 8090
          volumeMounts:
            - name: dex-grpc-tls
              mountPath: /etc/dex-grpc-tls
              readOnly: true
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.authAdmin.resources | nindent 12 }}
      volumes:
        - name: dex-grpc-tls
          secret:
            secretName: amp-dex-grpc-client-tls
---
apiVersion: v1
kind: Service
metadata:
  name: amp-authadmin
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: amp-authadmin
  ports:
    - name: http
      port: 8090
      targetPort: http
