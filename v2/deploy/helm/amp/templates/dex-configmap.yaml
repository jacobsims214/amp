apiVersion: v1
kind: ConfigMap
metadata:
  name: amp-dex-config
  namespace: {{ .Values.global.namespace }}
data:
  config.yaml.tmpl: |
    issuer: https://{{ .Values.global.domain }}/dex

    storage:
      type: postgres
      config:
        host: {{ .Values.cnpg.clusterName }}-rw.{{ .Values.global.namespace }}.svc.cluster.local
        port: 5432
        database: dex
        user: {{ .Values.cnpg.appOwner }}
        password: __AMP_DEX_DB_PASSWORD__
        ssl:
          mode: require
        {{- with .Values.dex.storage }}
        {{- if .maxOpenConns }}
        maxOpenConns: {{ int .maxOpenConns }}
        {{- end }}
        {{- if .maxIdleConns }}
        maxIdleConns: {{ int .maxIdleConns }}
        {{- end }}
        {{- if .connMaxLifetime }}
        connMaxLifetime: {{ int .connMaxLifetime }}
        {{- end }}
        {{- if .connectionTimeout }}
        connectionTimeout: {{ int .connectionTimeout }}
        {{- end }}
        {{- end }}

    web:
      http: 0.0.0.0:{{ .Values.dex.httpPort }}

    frontend:
      issuer: AMP
      theme: {{ .Values.dex.theme }}
      {{- if eq .Values.dex.theme "amp" }}
      # Serve from disk (not the copy built into Dex) so the mounted theme is found.
      dir: /srv/dex/web
      logoURL: theme/logo.svg
      {{- end }}

    grpc:
      addr: 0.0.0.0:{{ .Values.dex.grpcPort }}
      tlsCert: /etc/dex-grpc-tls/tls.crt
      tlsKey: /etc/dex-grpc-tls/tls.key
      tlsClientCA: /etc/dex-grpc-tls/ca.crt

    oauth2:
      skipApprovalScreen: true
      passwordConnector: local
      pkce:
        enforce: true
        codeChallengeMethodsSupported: ["S256"]

    enablePasswordDB: true
    {{- with .Values.dex.connectors }}

    # SSO connectors from values (dex.connectors). Dex lists them next to
    # the password login; $NAME values come from dex.connectorSecret.
    connectors:
      {{- toYaml . | nindent 6 }}
    {{- end }}

    staticClients:
      - idEnv: DEX_UI_CLIENT_ID
        secretEnv: DEX_UI_CLIENT_SECRET
        redirectURIs:
          - "https://{{ .Values.global.domain }}/oauth2/callback"
        name: "AMP UI (oauth2-proxy)"
    {{- if .Values.global.bootstrapAdminEmails }}

    staticPasswords: []
    {{- end }}
