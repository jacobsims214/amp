{{- /* Where sessions live: "cookie" (default) or "redis" (the chart's Valkey). See oauth2Proxy.sessionStore in values.yaml. */ -}}
{{- $sessionStore := .Values.oauth2Proxy.sessionStore | default "cookie" -}}
{{- if not (has $sessionStore (list "cookie" "redis")) -}}
{{- fail (printf "oauth2Proxy.sessionStore must be \"cookie\" or \"redis\", got %q" $sessionStore) -}}
{{- end -}}
{{- if and (eq $sessionStore "redis") (not .Values.valkey.enabled) -}}
{{- fail "oauth2Proxy.sessionStore=redis keeps sessions in the chart's Valkey: set valkey.enabled=true, or use sessionStore=cookie" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "amp.componentLabels" (dict "component" "oauth2-proxy" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.oauth2Proxy.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      securityContext:
        {{- include "amp.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: wait-for-dex
          image: busybox:1.36
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 65534) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until nc -z dex {{ .Values.dex.httpPort }}; do echo waiting for dex; sleep 3; done
        {{- if eq $sessionStore "redis" }}
        - name: wait-for-valkey
          image: busybox:1.36
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 65534) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until nc -z amp-valkey 6379; do echo waiting for valkey; sleep 3; done
        {{- end }}
      containers:
        - name: oauth2-proxy
          image: {{ .Values.oauth2Proxy.image }}:{{ .Values.oauth2Proxy.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "amp.containerSecurityContext" . | nindent 12 }}
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://{{ .Values.global.domain }}/dex
            - --skip-oidc-discovery=true
            - --login-url=https://{{ .Values.global.domain }}/dex/auth
            - --redeem-url=http://dex.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.dex.httpPort }}/dex/token
            - --oidc-jwks-url=http://dex.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.dex.httpPort }}/dex/keys
            - --redirect-url=https://{{ .Values.global.domain }}/oauth2/callback
            # Leading dot shares the session cookie with asynqmon's dedicated
            # subdomain (see amp.asynqmonDomain helper) — without this,
            # logging in on the main domain wouldn't authenticate you there.
            - --cookie-domain=.{{ .Values.global.domain }}
            - --email-domain=*
            - --http-address=0.0.0.0:4180
            - --upstream=static://200
            - --pass-authorization-header=true
            - --set-authorization-header=true
            - --pass-access-token=true
            - --cookie-name=_amp_oauth2_proxy
            - --cookie-secure={{ .Values.oauth2Proxy.cookieSecure }}
            - --cookie-samesite=lax
            - --skip-provider-button=true
            - --silence-ping-logging=true
            - --standard-logging=true
            # offline_access makes Dex issue a refresh_token alongside the
            # access/ID token. Without it there's nothing for cookie-refresh
            # below to use, and the underlying token silently goes stale
            # long before the 168h session cookie's own expiry — forcing a
            # full manual re-login through Dex far more often than the
            # cookie's stated lifetime implies. See discoveries/oauth2-proxy-token-refresh-gap.md.
            - --scope=openid email profile offline_access
            # Proactively refresh the underlying token this often rather
            # than waiting for it to fail — keeps the session smoothly
            # alive for the full cookie lifetime with no user-visible
            # re-login prompts.
            - --cookie-refresh=1h
            # Send a nonce with each sign-in. Dex copies it into every token it
            # refreshes from that sign-in, so amp-api can tell an hourly
            # refresh from a new sign-in and writes auth.login once per
            # sign-in (AMP #2440). Checked against Dex v2.42.0 and
            # oauth2-proxy v7.7.1: refreshes keep working and keep the nonce.
            - --insecure-oidc-skip-nonce=false
            {{- if eq $sessionStore "redis" }}
            # Keep sessions in Valkey; the cookie only carries a ticket for
            # them. oauth2-proxy (v7.7.1) then locks a session while it
            # refreshes it, so parallel requests past cookie-refresh redeem
            # the refresh token once instead of racing, and the cookie stays
            # valid across refreshes. The password is OAUTH2_PROXY_REDIS_PASSWORD below.
            - --session-store-type=redis
            - --redis-connection-url=redis://amp-valkey.{{ .Values.global.namespace }}.svc.cluster.local:6379
            {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: amp-oauth2-proxy, key: client-id } }
            {{- with .Values.oauth2Proxy.existingSecret }}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ . }}, key: {{ $.Values.oauth2Proxy.existingSecretClientSecretKey | default "client-secret" }} } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: {{ . }}, key: {{ $.Values.oauth2Proxy.existingSecretCookieSecretKey | default "cookie-secret" }} } }
            {{- else }}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: amp-oauth2-proxy, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: amp-oauth2-proxy, key: cookie-secret } }
            {{- end }}
            {{- if eq $sessionStore "redis" }}
            - name: OAUTH2_PROXY_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: amp-valkey-users, key: default } }
            {{- end }}
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.oauth2Proxy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
