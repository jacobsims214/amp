apiVersion: apps/v1
kind: Deployment
metadata:
  name: amp-mcpoauth
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "amp.componentLabels" (dict "component" "mcpoauth" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.mcpOAuth.replicas }}
  selector:
    matchLabels:
      app: amp-mcpoauth
  template:
    metadata:
      labels:
        app: amp-mcpoauth
    spec:
      initContainers:
        - name: wait-for-dex-grpc
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z dex-grpc {{ .Values.dex.grpcPort }}; do echo waiting for dex-grpc; sleep 3; done
      containers:
        - name: amp-mcpoauth
          image: {{ include "amp.image" (dict "image" .Values.mcpOAuth.image "tag" .Values.mcpOAuth.tag "root" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ADDR
              value: ":8091"
            - name: MCP_OAUTH_PUBLIC_URL
              value: "https://{{ .Values.global.domain }}/mcp-oauth"
            - name: DEX_PUBLIC_URL
              value: "https://{{ .Values.global.domain }}/dex"
            - name: MCP_RESOURCE_URL
              value: "https://{{ .Values.global.domain }}/mcp"
            - name: DEX_GRPC_ADDR
              value: "dex-grpc.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.dex.grpcPort }}"
            - name: DEX_GRPC_CA_CERT
              value: /etc/dex-grpc-tls/ca.crt
            - name: DEX_GRPC_CLIENT_CERT
              value: /etc/dex-grpc-tls/tls.crt
            - name: DEX_GRPC_CLIENT_KEY
              value: /etc/dex-grpc-tls/tls.key
          ports:
            - name: http
              containerPort: 8091
          volumeMounts:
            - name: dex-grpc-tls
              mountPath: /etc/dex-grpc-tls
              readOnly: true
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mcpOAuth.resources | nindent 12 }}
      volumes:
        - name: dex-grpc-tls
          secret:
            secretName: amp-dex-grpc-client-tls
---
apiVersion: v1
kind: Service
metadata:
  name: amp-mcpoauth
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: amp-mcpoauth
  ports:
    - name: http
      port: 8091
      targetPort: http
