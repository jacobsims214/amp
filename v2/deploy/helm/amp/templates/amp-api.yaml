{{- $receiptStore := include "amp.receiptStore" . }}
{{- $receiptsLocal := eq $receiptStore "local" }}
{{- $receiptsS3 := .Values.ampApi.receipts.s3 | default dict }}
{{- if and (eq $receiptStore "s3") (not $receiptsS3.existingSecret) }}
{{- fail "ampApi.receipts.s3.endpoint is set but ampApi.receipts.s3.existingSecret isn't: name the Secret holding the S3 key pair" }}
{{- end }}
{{- $receiptsMode := .Values.ampApi.receipts.storage.accessMode | default "ReadWriteOnce" }}
{{- /* Only the local store mounts a shared volume; S3 needs no ReadWriteMany. */}}
{{- if and $receiptsLocal (gt (int .Values.ampApi.replicas) 1) (ne $receiptsMode "ReadWriteMany") }}
{{- fail (printf "ampApi.replicas is %d but ampApi.receipts.storage.accessMode is %s: every amp-api replica mounts the receipt evidence volume, so more than one replica needs ReadWriteMany storage (nfs-storage in production)" (int .Values.ampApi.replicas) $receiptsMode) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amp-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "amp.componentLabels" (dict "component" "amp-api" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.ampApi.replicas }}
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: amp-api
  template:
    metadata:
      labels:
        app: amp-api
    spec:
      securityContext:
        # fsGroup: the receipt evidence volume is group-writable by uid 1000
        # whatever the storage backend's default ownership.
        {{- include "amp.podSecurityContext" (dict "fsGroup" 1000) | nindent 8 }}
      {{- if gt (int .Values.ampApi.replicas) 1 }}
      # Spread replicas over nodes, so losing one node doesn't take them all.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: amp-api
      {{- end }}
      initContainers:
        {{- if $receiptsLocal }}
        # The receipt evidence volume belongs to uid 1000 (amp-api), as the
        # chart does for every PVC-owning pod: fsGroup isn't applied on
        # hostPath or local-path. Only the top directory: everything under it
        # is created by amp-api itself, so a large volume isn't walked on
        # every start. Non-fatal: if the chown is refused (e.g. root_squash),
        # amp-api still starts and logs that the store is unavailable.
        - name: fix-permissions
          image: busybox:1.36
          securityContext:
            {{- include "amp.chownInitSecurityContext" . | nindent 12 }}
          command: ["sh", "-c", "chown 1000:1000 /data/receipts && chmod 0750 /data/receipts || echo 'warning: could not chown /data/receipts'"]
          volumeMounts:
            - name: receipts
              mountPath: /data/receipts
        {{- end }}
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 65534) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.cnpg.clusterName }}-rw 5432; do echo waiting for postgres; sleep 3; done
        {{- if .Values.valkey.enabled }}
        - name: wait-for-valkey
          image: busybox:1.36
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 65534) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until nc -z amp-valkey 6379; do echo waiting for valkey; sleep 3; done
        {{- end }}
        {{- if eq $receiptStore "seaweedfs" }}
        # Not required (amp-api retries the store at the first upload), but
        # it saves a "not reachable yet" warning on a fresh install.
        - name: wait-for-seaweedfs
          image: busybox:1.36
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 65534) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 40); do nc -z amp-seaweedfs 8333 && exit 0; echo waiting for seaweedfs; sleep 3; done
              echo 'seaweedfs not up yet: amp-api starts anyway'
        {{- end }}
      containers:
        - name: amp-api
          image: {{ include "amp.image" (dict "image" .Values.ampApi.image "tag" .Values.ampApi.tag "root" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "amp.containerSecurityContext" . | nindent 12 }}
          env:
            - name: PGHOST
              value: "{{ .Values.cnpg.clusterName }}-rw.{{ .Values.global.namespace }}.svc.cluster.local"
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: {{ .Values.cnpg.clusterName }}-app, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.cnpg.clusterName }}-app, key: password } }
            - name: DATABASE_URL
              value: "postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/{{ .Values.cnpg.appDatabase }}?sslmode=require"
            {{- include "amp.trustedProxiesEnv" . | nindent 12 }}
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            # Replicas share projects (internal/cluster): each runs the
            # projects it owns and passes others' requests to their owner on
            # this port. Not routed by Envoy.
            - name: CLUSTER_ADDR
              value: ":3003"
            - name: CLUSTER_ADVERTISE_ADDR
              value: "$(POD_IP):3003"
            # Keep serving while Kubernetes takes the pod out of the Service.
            - name: SHUTDOWN_DELAY
              value: "5s"
            - name: MCP_ADDR
              value: ":8000"
            - name: API_ADDR
              value: ":3001"
            - name: MCP_PUBLIC_URL
              value: "https://{{ .Values.global.domain }}/mcp"
            - name: MCP_OAUTH_PUBLIC_URL
              value: "https://{{ .Values.global.domain }}/mcp-oauth"
            - name: TYPESENSE_URL
              value: "http://typesense.{{ .Values.global.namespace }}.svc.cluster.local:8108"
            - name: TYPESENSE_API_KEY
              {{- if .Values.typesense.existingSecret }}
              valueFrom: { secretKeyRef: { name: {{ .Values.typesense.existingSecret }}, key: {{ .Values.typesense.existingSecretKey | default "api-key" }} } }
              {{- else }}
              value: {{ .Values.typesense.apiKey | quote }}
              {{- end }}
            - name: OLLAMA_URL
              value: "http://ollama.{{ .Values.global.namespace }}.svc.cluster.local:11434"
            - name: OLLAMA_MODEL
              value: {{ .Values.ollama.model | quote }}
            - name: OIDC_ISSUER_URL
              value: "https://{{ .Values.global.domain }}/dex"
            - name: OIDC_DISCOVERY_URL
              value: "http://dex.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.dex.httpPort }}/dex"
            - name: BOOTSTRAP_ADMIN_EMAILS
              value: {{ .Values.global.bootstrapAdminEmails | quote }}
            - name: MCP_AUDIENCE
              value: {{ .Values.auth.mcpAudience | quote }}
            - name: REST_AUDIENCES
              value: {{ .Values.oauth2Proxy.clientID | quote }}
            # Tokens issued to this client on REST are the web UI (plan
            # approval and other human-only actions need it).
            - name: UI_CLIENT_ID
              value: {{ .Values.auth.uiClientID | default .Values.oauth2Proxy.clientID | quote }}
            - name: MCP_ALLOWED_ORIGINS
              value: "https://{{ .Values.global.domain }}"
            {{- with .Values.ampApi.signupAllowedDomains }}
            - name: SIGNUP_ALLOWED_DOMAINS
              value: {{ . | quote }}
            {{- end }}
            - name: WEBHOOK_ALLOW_PRIVATE_NETWORKS
              value: {{ .Values.ampApi.webhookAllowPrivateNetworks | default false | quote }}
            {{- with .Values.ampApi.audit }}
            # Audit retention, and the checkpoint signing key from its Secret
            # (never in the database; see values.yaml ampApi.audit).
            - name: AUDIT_RETENTION_DAYS
              value: {{ .retentionDays | toString | quote }}
            {{- if .signingKey.existingSecret }}
            # optional: a missing Secret means no key (verify says
            # "unproven"), not a pod that can't start.
            - name: AUDIT_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: {{ .signingKey.existingSecret }}, key: {{ .signingKey.key | default "signing-key" }}, optional: true } }
            {{- end }}
            {{- with .retiredPublicKeys }}
            - name: AUDIT_SIGNING_PUBLIC_KEYS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.ampApi.secretsEncryption }}
            {{- if .existingSecret }}
            # Webhook secrets encryption key (values.yaml
            # ampApi.secretsEncryption). optional: a missing Secret means no
            # key (auth headers refused), not a pod that can't start.
            - name: AMP_SECRETS_KEY
              valueFrom: { secretKeyRef: { name: {{ .existingSecret }}, key: {{ .key | default "encryption-key" }}, optional: true } }
            - name: AMP_SECRETS_RETIRED_KEYS
              valueFrom: { secretKeyRef: { name: {{ .existingSecret }}, key: {{ .retiredKeysKey | default "retired-keys" }}, optional: true } }
            {{- end }}
            {{- end }}
            # Remote control of harness sessions (epic 165): the instance switch.
            - name: RELAY_ENABLED
              value: {{ .Values.relay.enabled | default false | quote }}
            {{- if .Values.relay.enabled }}
            # amp-relay's own database role: amp-api grants it what the relay
            # uses after migrating (#2392).
            - name: RELAY_DB_ROLE
              value: {{ .Values.relay.database.role | quote }}
            # amp-api ends sessions on the relay replica holding them with the
            # relay's cluster token (never its own).
            - name: RELAY_CLUSTER_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "amp.relayTokenSecret" . }}, key: {{ .Values.relay.clusterToken.key }} } }
            {{- end }}
            {{- with .Values.ampApi.appPublicUrl }}
            # The web origin (links, and the relay's exact Origin check on
            # browser POSTs). Unset: derived from MCP_PUBLIC_URL.
            - name: APP_PUBLIC_URL
              value: {{ . | trimSuffix "/" | quote }}
            {{- end }}
            # Verification receipt evidence (#126). It stays empty while every
            # project's setting is Off.
            {{- if $receiptsLocal }}
            # The local store on the amp-receipts PVC (ReadWriteMany, so
            # every replica sees the same files).
            - name: RECEIPT_DIR
              value: /data/receipts
            {{- else }}
            # S3 (#144): {{ if eq $receiptStore "seaweedfs" }}the bundled SeaweedFS, in-cluster, plain http{{ else }}ampApi.receipts.s3{{ end }}.
            # amp-api still serves the files; uploads are spooled on the
            # receipts-spool emptyDir before they are sent.
            - name: RECEIPT_STORE
              value: s3
            {{- if eq $receiptStore "seaweedfs" }}
            - name: RECEIPT_S3_ENDPOINT
              value: "amp-seaweedfs.{{ .Values.global.namespace }}.svc.cluster.local:8333"
            - name: RECEIPT_S3_BUCKET
              value: {{ .Values.seaweedfs.bucket | quote }}
            - name: RECEIPT_S3_USE_SSL
              value: "false"
            - name: RECEIPT_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "amp.seaweedfsSecret" . }}, key: access-key } }
            - name: RECEIPT_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "amp.seaweedfsSecret" . }}, key: secret-key } }
            {{- else }}
            - name: RECEIPT_S3_ENDPOINT
              value: {{ $receiptsS3.endpoint | quote }}
            - name: RECEIPT_S3_BUCKET
              value: {{ $receiptsS3.bucket | default "amp-receipts" | quote }}
            - name: RECEIPT_S3_REGION
              value: {{ $receiptsS3.region | default "us-east-1" | quote }}
            - name: RECEIPT_S3_USE_SSL
              value: {{ ternary "true" "false" (ne (toString $receiptsS3.useSSL) "false") | quote }}
            - name: RECEIPT_S3_PATH_STYLE
              value: {{ ternary "true" "false" (ne (toString $receiptsS3.pathStyle) "false") | quote }}
            - name: RECEIPT_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ $receiptsS3.existingSecret }}, key: {{ $receiptsS3.accessKeyKey | default "access-key" }} } }
            - name: RECEIPT_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ $receiptsS3.existingSecret }}, key: {{ $receiptsS3.secretKeyKey | default "secret-key" }} } }
            {{- end }}
            - name: RECEIPT_S3_SPOOL_DIR
              value: /data/receipts-spool
            {{- end }}
            - name: RECEIPT_MAX_BYTES
              value: {{ .Values.ampApi.receipts.maxBytes | int64 | toString | quote }}
            - name: RECEIPT_RETENTION_DAYS
              value: {{ .Values.ampApi.receipts.retentionDays | int | toString | quote }}
            {{- if .Values.valkey.enabled }}
            - name: REDIS_ADDR
              value: "amp-valkey.{{ .Values.global.namespace }}.svc.cluster.local:6379"
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: amp-valkey-users, key: default } }
            {{- end }}
          ports:
            - name: mcp
              containerPort: 8000
            - name: rest
              containerPort: 3001
            - name: cluster
              containerPort: 3003
          readinessProbe:
            httpGet: { path: /ready, port: rest }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: rest }
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            {{- if $receiptsLocal }}
            - name: receipts
              mountPath: /data/receipts
            {{- else }}
            - name: receipts-spool
              mountPath: /data/receipts-spool
            {{- end }}
          resources:
            {{- toYaml .Values.ampApi.resources | nindent 12 }}
      volumes:
        {{- if $receiptsLocal }}
        - name: receipts
          persistentVolumeClaim:
            claimName: amp-receipts
        {{- else }}
        - name: receipts-spool
          emptyDir: { sizeLimit: {{ .Values.ampApi.receipts.spoolSizeLimit | default "4Gi" }} }
        {{- end }}
---
{{- if $receiptsLocal }}
# Verification receipt evidence (#126): screenshots, videos and logs, up to
# ampApi.receipts.maxBytes a file, deleted after retentionDays unless kept.
# ReadWriteOnce by default (one replica); ReadWriteMany (production, on
# nfs-storage) lets any number of amp-api replicas share it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: amp-receipts
  namespace: {{ .Values.global.namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ $receiptsMode | quote }}]
  {{- if .Values.ampApi.receipts.storage.storageClassName }}
  storageClassName: {{ .Values.ampApi.receipts.storage.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ampApi.receipts.storage.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: amp-api
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: amp-api
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
    - name: rest
      port: 3001
      targetPort: rest
{{- if gt (int .Values.ampApi.replicas) 1 }}
---
# Voluntary disruptions (node drains, upgrades) keep at least one replica.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: amp-api
  namespace: {{ .Values.global.namespace }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: amp-api
{{- end }}
