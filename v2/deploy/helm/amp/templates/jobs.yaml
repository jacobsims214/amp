{{- $ns := .Values.global.namespace }}
{{- $secretName := "amp-bootstrap-admin" }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 20 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
type: Opaque
stringData:
  email: {{ .Values.global.bootstrapAdminEmails | splitList "," | first }}
  password: {{ $password }}
---
# Seeds the very first admin login in Dex. Idempotent — safe to rerun on
# every upgrade. Without this there's no way to log in and use the Users
# admin page in the first place. See NOTES.txt for how to fetch the
# generated password.
apiVersion: batch/v1
kind: Job
metadata:
  name: amp-bootstrap-admin
  namespace: {{ .Values.global.namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- include "amp.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: wait-for-dex-grpc
          image: busybox:1.36
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 65534) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until nc -z dex-grpc {{ .Values.dex.grpcPort }}; do echo waiting for dex-grpc; sleep 3; done
      containers:
        - name: seed-admin
          image: {{ include "amp.image" (dict "image" .Values.authAdmin.image "tag" .Values.authAdmin.tag "root" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "amp.containerSecurityContext" . | nindent 12 }}
          env:
            - name: RUN_MODE
              value: seed-admin
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: {{ .Values.cnpg.clusterName }}-app, key: host } }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: {{ .Values.cnpg.clusterName }}-app, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.cnpg.clusterName }}-app, key: password } }
            - name: DATABASE_URL
              value: "postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/{{ .Values.cnpg.appDatabase }}?sslmode=require"
            - name: SEED_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: {{ $secretName }}, key: email } }
            - name: SEED_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secretName }}, key: password } }
            - name: DEX_GRPC_ADDR
              value: "dex-grpc.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.dex.grpcPort }}"
            - name: DEX_GRPC_CA_CERT
              value: /etc/dex-grpc-tls/ca.crt
            - name: DEX_GRPC_CLIENT_CERT
              value: /etc/dex-grpc-tls/tls.crt
            - name: DEX_GRPC_CLIENT_KEY
              value: /etc/dex-grpc-tls/tls.key
          volumeMounts:
            - name: dex-grpc-tls
              mountPath: /etc/dex-grpc-tls
              readOnly: true
      volumes:
        - name: dex-grpc-tls
          secret:
            secretName: amp-dex-grpc-client-tls
{{- if .Values.postInstall.pullEmbeddingModel }}
---
# Replaces `make kb-setup` — pulls the embedding model into Ollama so the
# KB's semantic search works out of the box.
apiVersion: batch/v1
kind: Job
metadata:
  name: amp-pull-embedding-model
  namespace: {{ .Values.global.namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- include "amp.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: wait-for-ollama
          image: busybox:1.36
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 65534) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until nc -z ollama 11434; do echo waiting for ollama; sleep 3; done
      containers:
        - name: pull-model
          image: {{ .Values.ollama.image }}:{{ .Values.ollama.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 1000) | nindent 12 }}
          env:
            - name: OLLAMA_HOST
              value: "ollama.{{ .Values.global.namespace }}.svc.cluster.local:11434"
            - name: HOME
              value: /tmp
          command: ["ollama", "pull", "{{ .Values.ollama.model }}"]
{{- end }}
