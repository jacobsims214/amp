apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "amp.componentLabels" (dict "component" "dex" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.dex.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
      annotations:
        # Restart Dex when its config or login theme changes.
        checksum/config: {{ include (print $.Template.BasePath "/dex-configmap.yaml") . | sha256sum }}
        checksum/theme: {{ include (print $.Template.BasePath "/dex-theme-configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- include "amp.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: render-config
          image: busybox:1.36
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 65534) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              sed "s#__AMP_DEX_DB_PASSWORD__#$DEX_DB_PASSWORD#g" /tmpl/config.yaml.tmpl > /rendered/config.yaml
          env:
            - name: DEX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cnpg.clusterName }}-app
                  key: password
          volumeMounts:
            - name: tmpl
              mountPath: /tmpl
            - name: rendered
              mountPath: /rendered
      containers:
        - name: dex
          image: {{ .Values.dex.image }}:{{ .Values.dex.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "amp.containerSecurityContext" . | nindent 12 }}
          command: ["/usr/local/bin/dex", "serve", "/rendered/config.yaml"]
          {{- with .Values.dex.connectorSecret }}
          # Connector client secrets, referenced as $KEY in dex.connectors.
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          env:
            {{- with (.Values.dex.storage | default dict).pgOptions }}
            # Session settings for Dex's Postgres connections only (lib/pq
            # sends PGOPTIONS as the startup "options"). See dex.storage.
            - name: PGOPTIONS
              value: {{ . | quote }}
            {{- end }}
            - name: DEX_UI_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: amp-oauth2-proxy
                  key: client-id
            - name: DEX_UI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.oauth2Proxy.existingSecret }}
                  # Same Secret/key oauth2-proxy uses, so the two always match.
                  name: {{ .Values.oauth2Proxy.existingSecret }}
                  key: {{ .Values.oauth2Proxy.existingSecretClientSecretKey | default "client-secret" }}
                  {{- else }}
                  name: amp-oauth2-proxy
                  key: client-secret
                  {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.dex.httpPort }}
            - name: grpc
              containerPort: {{ .Values.dex.grpcPort }}
          volumeMounts:
            - name: rendered
              mountPath: /rendered
            - name: dex-grpc-tls
              mountPath: /etc/dex-grpc-tls
              readOnly: true
            {{- if eq .Values.dex.theme "amp" }}
            # A new theme directory beside Dex's own light and dark ones.
            - name: theme
              mountPath: /srv/dex/web/themes/amp
              readOnly: true
            {{- end }}
          {{- $probe := .Values.dex.storageProbe | default dict }}
          {{- if $probe.enabled }}
          {{- /*
            Goes through storage on every call (see dex.storageProbe in
            values.yaml): an unknown client_id makes Dex read the client table
            and answer 401. 401 is healthy; anything else, or a hang, fails.
          */}}
          {{- $cmd := printf "wget -q -T %d -O /dev/null --post-data 'grant_type=authorization_code&client_id=%s' http://127.0.0.1:%d/dex/token 2>&1 | grep -q ' 401 '" (int (sub (int $probe.timeoutSeconds) 1)) $probe.clientID (int .Values.dex.httpPort) }}
          readinessProbe:
            exec:
              command: ["sh", "-c", {{ $cmd | quote }}]
            initialDelaySeconds: 3
            periodSeconds: {{ $probe.readiness.periodSeconds }}
            timeoutSeconds: {{ $probe.timeoutSeconds }}
            failureThreshold: {{ $probe.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["sh", "-c", {{ $cmd | quote }}]
            initialDelaySeconds: 20
            periodSeconds: {{ $probe.liveness.periodSeconds }}
            timeoutSeconds: {{ $probe.timeoutSeconds }}
            failureThreshold: {{ $probe.liveness.failureThreshold }}
          {{- else }}
          readinessProbe:
            httpGet: { path: /dex/healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /dex/healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- end }}
          resources:
            {{- toYaml .Values.dex.resources | nindent 12 }}
      volumes:
        - name: tmpl
          configMap:
            name: amp-dex-config
        - name: rendered
          emptyDir: {}
        - name: dex-grpc-tls
          secret:
            secretName: amp-dex-grpc-server-tls
        {{- if eq .Values.dex.theme "amp" }}
        - name: theme
          configMap:
            name: amp-dex-theme
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: dex
  ports:
    - name: http
      port: {{ .Values.dex.httpPort }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: dex-grpc
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: dex
  ports:
    - name: grpc
      port: {{ .Values.dex.grpcPort }}
      targetPort: grpc
