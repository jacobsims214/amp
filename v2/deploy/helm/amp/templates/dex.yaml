apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "amp.componentLabels" (dict "component" "dex" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.dex.replicas }}
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      securityContext:
        {{- include "amp.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: render-config
          image: busybox:1.36
          securityContext:
            {{- include "amp.containerSecurityContext" (dict "runAsUser" 65534) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              sed "s#__AMP_DEX_DB_PASSWORD__#$DEX_DB_PASSWORD#g" /tmpl/config.yaml.tmpl > /rendered/config.yaml
          env:
            - name: DEX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cnpg.clusterName }}-app
                  key: password
          volumeMounts:
            - name: tmpl
              mountPath: /tmpl
            - name: rendered
              mountPath: /rendered
      containers:
        - name: dex
          image: {{ .Values.dex.image }}:{{ .Values.dex.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "amp.containerSecurityContext" . | nindent 12 }}
          command: ["/usr/local/bin/dex", "serve", "/rendered/config.yaml"]
          env:
            - name: DEX_UI_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: amp-oauth2-proxy
                  key: client-id
            - name: DEX_UI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: amp-oauth2-proxy
                  key: client-secret
          ports:
            - name: http
              containerPort: {{ .Values.dex.httpPort }}
            - name: grpc
              containerPort: {{ .Values.dex.grpcPort }}
          volumeMounts:
            - name: rendered
              mountPath: /rendered
            - name: dex-grpc-tls
              mountPath: /etc/dex-grpc-tls
              readOnly: true
          readinessProbe:
            httpGet: { path: /dex/healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /dex/healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.dex.resources | nindent 12 }}
      volumes:
        - name: tmpl
          configMap:
            name: amp-dex-config
        - name: rendered
          emptyDir: {}
        - name: dex-grpc-tls
          secret:
            secretName: amp-dex-grpc-server-tls
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: dex
  ports:
    - name: http
      port: {{ .Values.dex.httpPort }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: dex-grpc
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: dex
  ports:
    - name: grpc
      port: {{ .Values.dex.grpcPort }}
      targetPort: grpc
