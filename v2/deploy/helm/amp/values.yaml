## AMP Helm chart — default values (local docker-desktop profile).
## For the datacenter cluster, override via -f values-production.yaml (see
## docs/deploy-architecture.md for the promotion checklist).

global:
  namespace: amp
  # Public base domain. Locally this can stay "amp.local" (add it to
  # /etc/hosts pointing at the docker-desktop LB / port-forward address).
  domain: amp.local
  # Set true once you have a real DNS name + reachable Envoy for Let's Encrypt.
  # Locally this is always false (selfsigned CA).
  tls:
    enabled: true
    issuer: selfsigned   # selfsigned | letsencrypt-http01 | letsencrypt-dns01
    letsencrypt:
      email: "ops@example.com"
      dns01:
        provider: ""        # e.g. "route53", "cloudflare" — wire the matching cert-manager solver block yourself in values-production.yaml
  bootstrapAdminEmails: "admin@amp.local"
  # Single override point for every amp-{api,ui,authadmin,mcpoauth} image tag
  # at once — set via ArgoCD's Application `helm.parameters` (see
  # deploy/argocd/amp-application.yaml) or --set global.imageTag=<tag> for
  # manual deploys. Per-component *.tag values below still win if set
  # explicitly (empty string means "defer to this").
  imageTag: ""

  # Pin real values here (values-production.yaml does) to avoid template-time
  # randomness racing across ArgoCD syncs — see templates/secrets.yaml.
  # Left empty for local dev, which always deploys via plain `helm upgrade`
  # (lookup-based stability works fine there).
  secretOverrides:
    oauth2ProxyClientSecret: ""
    oauth2ProxyCookieSecret: ""
    valkeyPassword: ""
    # amp-relay's database role password and its cluster token (relay.enabled
    # only; see relay.database and relay.clusterToken).
    relayDbPassword: ""
    relayClusterToken: ""

image:
  pullPolicy: IfNotPresent
  registry: ""   # empty = local images built straight into the docker-desktop node, no registry needed

# MCP token audience (MCP spec 2026-07-28: an MCP server MUST only accept
# tokens issued for it). amp-mcpoauth makes Dex mint MCP tokens with
# aud=<mcpAudience> via Dex cross-client trust; amp-api rejects /mcp tokens
# without it (and accepts it alongside oauth2Proxy.clientID on /api).
auth:
  mcpAudience: amp-mcp
  # The web UI's Dex client (UI_CLIENT_ID). Only REST requests with a token
  # issued to it count as a person in the web UI: the one channel that can
  # approve a plan or an artifact, turn plan approval off, or mark a person's
  # ticket done. Empty: oauth2Proxy.clientID, which is that client.
  uiClientID: ""

ampApi:
  image: amp-api
  tag: local
  # Any number works: each project runs on one replica and the others pass
  # its requests there; if a replica dies, the rest take its projects over
  # within ~10s. 2+ keeps AMP up through a pod or node failure.
  replicas: 1
  # Who becomes an AMP user on first sign-in, e.g. through an SSO connector:
  # comma-separated email domains ("acme.com,acme.io"). Invited emails and
  # bootstrap admins always can; existing users are unaffected. Empty: anyone
  # who can sign in to Dex.
  signupAllowedDomains: ""
  # Let webhooks reach private, loopback, and in-cluster addresses (e.g. an
  # n8n on your LAN). Off: a project owner's webhook URL can't be used to
  # reach services inside the cluster.
  webhookAllowPrivateNetworks: false
  # Audit log integrity and retention (KB decisions/audit-log-v2.md).
  audit:
    # Entries older than this are deleted daily, through a signed anchor
    # checkpoint so the rest still verifies. 0 keeps them forever.
    retentionDays: 365
    # Ed25519 key that signs the hourly audit checkpoints. It lives only in
    # this Secret, never in the database. Make one with
    #   amp-api audit keygen -out signing-key
    #   kubectl -n amp create secret generic amp-audit-signing --from-file=signing-key=signing-key
    # Unset: checkpoints are written unsigned (amp-api logs a warning, and
    # `audit verify` reports them as unsigned): the hash chain still shows
    # edits, but can't prove them against someone with database access.
    signingKey:
      existingSecret: ""
      key: signing-key
    # Public keys (base64, comma-separated) of retired signing keys, so
    # checkpoints signed before a rotation still verify. Not secret.
    retiredPublicKeys: ""
  # Encryption at rest for webhook auth headers and signing secrets (#2441):
  # AES-256-GCM under a key that lives only in this Secret, never in the
  # database or in git. Make one with
  #   openssl rand -base64 32 | tr -d '\n' > encryption-key
  #   kubectl -n amp create secret generic amp-secrets-encryption --from-file=encryption-key=encryption-key
  #   rm encryption-key        # keep a copy somewhere safe first
  # Unset (or the Secret missing): auth headers can't be added (the API
  # says why), signing secrets are stored in plaintext as before, and
  # existing plaintext values keep working. amp-api encrypts plaintext
  # values at startup once a key is set. To rotate, put the new key in
  # `key` and the old one(s) in `retiredKeysKey` (comma-separated), restart,
  # then remove the retired entry: startup re-encrypts under the new key.
  secretsEncryption:
    existingSecret: ""
    key: encryption-key
    retiredKeysKey: retired-keys
  # The web app's origin as browsers see it ("https://amp.example" or
  # "https://amp.local:8443"), no trailing slash. Links in MCP replies and the
  # remote control relay's Origin check use it. Empty: https://<global.domain>
  # (derived from MCP_PUBLIC_URL).
  appPublicUrl: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Remote control of a harness session from the web app (epic 165). Off by
# default. relay.enabled deploys amp-relay, the relay's own service (#2387),
# adds Envoy's routes to it (/relay/ without ext_authz, /api/sessions behind
# the cookie session, unbounded timeouts on the streams), and tells amp-api a
# relay exists (RELAY_ENABLED: the /api/me capability). amp-api serves no relay
# route, so scaling amp-relay to 0 turns remote control off for everyone.
# When on, an org admin still has to turn it on for their org (org settings),
# and each person turns it on per session with /remote in the harness. Needs
# auth (amp-relay refuses to start without Dex).
#
# Org default: always off. Each org's switch (and its idle timeout, 5-240 min,
# default 30, and device pin days) is an org setting in the database, edited by
# org admins in the web app (PUT /api/orgs/:id/remote-control), not here.
# amp-relay only accepts browser POSTs whose Origin is exactly the web address
# (ampApi.appPublicUrl, else https://<global.domain>), so set
# ampApi.appPublicUrl when people reach AMP on another origin (a port-forward
# such as :8443, or a different public host).
# Anything in front of Envoy (Traefik, a cloud LB) must not cut long SSE
# streams either: see KB how-to/remote-control-local-test.md.
relay:
  enabled: false
  image: amp-relay
  tag: local
  # 2+ keeps remote control up through a pod or node failure: a session lives
  # on one replica, the others forward to it, and take it over if it dies.
  replicas: 2
  # Envoy's cap on one relay stream (the harness's command stream and a
  # browser's event stream). Per stream, not per session: a session has no
  # time limit by default (#2424), and the harness and the browser reopen a
  # stream Envoy cuts at once, so this only bounds how long one connection
  # is held.
  maxStreamDuration: 43200s
  # A relay stream with no bytes for this long is cut (the relay sends a
  # keepalive every 20 s and the harness a heartbeat every 20 s, so only a
  # dead peer gets there).
  streamIdleTimeout: 120s
  # Every other relay call (register, token refresh, event batches,
  # heartbeats, pairing, end, the browser's commands) is a short request.
  requestTimeout: 30s
  # Refuse to render with relay.enabled unless the relay's database password
  # and cluster token are pinned (database.existingSecret or
  # global.secretOverrides.relayDbPassword, clusterToken.existingSecret or
  # global.secretOverrides.relayClusterToken). values-production.yaml turns it
  # on: under ArgoCD the generated values change on every sync.
  requirePinnedSecrets: false
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # Least privilege (#2392): amp-relay connects to Postgres as its own role,
  # never amp-api's. The chart declares it as a CloudNativePG managed role
  # (cnpg-cluster.yaml) with the password in a basic-auth Secret, and amp-api
  # grants it only the tables and columns the relay uses (RELAY_DB_ROLE) after
  # every migration run.
  database:
    role: amp_relay
    # A kubernetes.io/basic-auth Secret you manage (username = role,
    # password). Empty: the chart makes amp-relay-db (password from
    # global.secretOverrides.relayDbPassword, else the existing Secret's,
    # else random). Under ArgoCD use this or the override: a password
    # regenerated on a sync changes the role's password under running pods.
    existingSecret: ""
  # The relay's own cluster token: relay replicas use it with each other and
  # amp-api uses it to call them (/internal/relay/ only). Never amp-api's own
  # cluster token, which stays in the database where the relay's role can't
  # read it. Mounted in amp-relay and amp-api as RELAY_CLUSTER_TOKEN.
  clusterToken:
    # A Secret you manage with the token (32+ random characters) under key.
    # Empty: the chart makes amp-relay-cluster-token (value from
    # global.secretOverrides.relayClusterToken, else the existing Secret's,
    # else random).
    existingSecret: ""
    key: token
  # NetworkPolicy for amp-relay's pods: :3002 (the relay) only from Envoy,
  # :3003 (internal: forwarding and control calls) only from amp-relay and
  # amp-api. Needs a CNI that enforces NetworkPolicy; without one it's inert.
  networkPolicy:
    enabled: true

ui:
  image: amp-ui
  tag: local
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

authAdmin:
  image: amp-authadmin
  tag: local
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

mcpOAuth:
  image: amp-mcpoauth
  tag: local
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

dex:
  image: ghcr.io/dexidp/dex
  tag: v2.42.0
  replicas: 1
  httpPort: 5556
  grpcPort: 5557
  # Login page look: "amp" (AMP's own, files/dex-theme), or Dex's "light"/"dark".
  theme: amp
  # SSO: Dex connectors, shown next to the password login. Any Dex connector
  # works (google, github, microsoft, oidc, ldap, saml); see
  # https://dexidp.io/docs/connectors/. Put client secrets in a Secret in the
  # amp namespace, name it in connectorSecret, and reference its keys as
  # $KEY. People who sign in this way become AMP users by their (verified)
  # email; limit that with ampApi.signupAllowedDomains. Example:
  #
  #   connectors:
  #     - type: google
  #       id: google
  #       name: Google
  #       config:
  #         clientID: $GOOGLE_CLIENT_ID
  #         clientSecret: $GOOGLE_CLIENT_SECRET
  #         redirectURI: https://amp.example.com/dex/callback
  #         hostedDomains: [example.com]
  #   connectorSecret: amp-dex-connectors   # keys GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
  connectors: []
  connectorSecret: ""
  # Dex's Postgres connection pool and session settings. These apply to Dex's
  # own connections (database "dex") only; amp-api is not affected.
  #
  # Why (incident 2026-10-26, KB discoveries/dex-frozen-replica-incident.md):
  # Dex v2.42 refreshes a token inside a SERIALIZABLE transaction and, while
  # that transaction holds a pooled connection, asks the password connector to
  # re-read the user, which needs a second connection. With the default pool
  # of 5, five concurrent refreshes on one replica deadlock the pool for good:
  # five sessions sit "idle in transaction" holding row locks, the replica
  # stops answering anything that touches storage, and /dex/healthz stays
  # green. A bigger pool makes that much less likely; the timeout below ends
  # the stuck sessions so they stop blocking the other replica; the storage
  # probe further down restarts the frozen replica.
  storage:
    maxOpenConns: 20        # Dex default 5. Per replica; Postgres max_connections is 100.
    maxIdleConns: 5
    connMaxLifetime: 1800   # seconds
    connectionTimeout: 10   # seconds to open a connection (Dex default: wait forever)
    # Sent by lib/pq as the startup "options" (PGOPTIONS env on the Dex
    # container), so it is a session setting of Dex's connections only.
    # Empty disables it.
    pgOptions: "-c idle_in_transaction_session_timeout=60s"
  # Probe that goes through storage on every call. Dex's /dex/healthz can't be
  # trusted for this: its storage check has no timeout and keeps reporting its
  # last result while blocked, and /dex/keys is cached until key rotation.
  # The probe POSTs an unknown client_id to /dex/token, which makes Dex look
  # the client up in Postgres (a read, nothing is written) and answer 401.
  # Any other answer, or none within timeoutSeconds, is a failure.
  # Set enabled: false to go back to the plain /dex/healthz probes.
  storageProbe:
    enabled: true
    clientID: amp-storage-probe   # must NOT be a real client
    timeoutSeconds: 5
    readiness: { periodSeconds: 10, failureThreshold: 2 }   # out of the Service in ~20s
    liveness: { periodSeconds: 15, failureThreshold: 4 }    # restarted after ~60s
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }

oauth2Proxy:
  image: quay.io/oauth2-proxy/oauth2-proxy
  tag: v7.7.1
  replicas: 1
  clientID: amp-ui
  # clientSecret is generated into a Secret by templates/secrets.yaml if not overridden
  # Name of an existing Secret holding the client secret and cookie secret.
  # When set, oauth2-proxy AND Dex (its static client) read both from it, and
  # global.secretOverrides.oauth2Proxy* / the generated values are not used;
  # the chart-made amp-oauth2-proxy Secret then only carries client-id.
  # When empty, the old behaviour (templates/secrets.yaml) is unchanged.
  existingSecret: ""
  existingSecretClientSecretKey: client-secret   # key inside existingSecret
  existingSecretCookieSecretKey: cookie-secret   # key inside existingSecret
  cookieSecure: true
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

envoy:
  image: envoyproxy/envoy
  tag: v1.31-latest
  replicas: 1
  service:
    type: ClusterIP   # Traefik handles external ingress now
    httpsPort: 443
    httpPort: 80          # kept open only for ACME HTTP-01 + local convenience redirect to https
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 128Mi }

typesense:
  image: typesense/typesense
  tag: "30.1"
  apiKey: amp-local-dev   # override in values-production.yaml / a Secret for real deployments
  # Name of an existing Secret holding the API key. When set, both Typesense
  # and amp-api read the key from it and apiKey above is ignored; when empty,
  # apiKey is used as a plain value (the old behaviour).
  existingSecret: ""
  existingSecretKey: api-key   # key inside existingSecret
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }
  storage:
    size: 2Gi
    storageClassName: ""  # empty = cluster default

ollama:
  image: ollama/ollama
  tag: latest
  model: nomic-embed-text
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  storage:
    size: 5Gi
    storageClassName: ""

cnpg:
  clusterName: amp-postgres
  instances: 1              # bump to 3 for HA in the datacenter
  storage:
    size: 5Gi
    storageClassName: ""
  appDatabase: amp
  appOwner: amp
  postgresVersion: "16"

# Backs the asynq indexing queue — amp-api enqueues KB indexing jobs here
# instead of writing to Typesense inline, so a burst of writes gets smoothed
# out at a controlled worker concurrency instead of hammering Typesense
# directly. Standalone (no replication) is plenty for a queue this size.
valkey:
  enabled: true
  auth:
    enabled: true
    usersExistingSecret: amp-valkey-users
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: default
  dataStorage:
    enabled: false   # queue data is disposable — a lost job just gets re-enqueued on the next write
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }

asynqmon:
  image: hibiken/asynqmon
  tag: "0.7.1"
  # asynqmon's SPA assumes it owns the whole root path space of its origin
  # (client-side router has no basename support, and it makes its own "/api"
  # calls that would collide with amp-api's REST API under the same domain)
  # — so it gets its own subdomain via an Envoy host-based virtual_host,
  # not a path prefix. Needs a DNS record for
  # "{{ .subdomain }}.{{ global.domain }}" pointing at the same place as
  # global.domain (see NOTES.txt).
  subdomain: "queues"
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

asynqmonGate:
  image: amp-asynqmon-gate
  tag: local   # amp-{api,ui,authadmin,mcpoauth,asynqmon-gate} all fall back to global.imageTag when empty
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

postInstall:
  # Pulls the embedding model into Ollama after it's up — replaces `make kb-setup`.
  pullEmbeddingModel: true
