  skills/amp-planning/SKILL.md:
    body:
      - paragraph: "**Do not hardcode a roster here or memorize agent names across sessions.**"
        with: |
          **Do not hardcode a roster here or memorize agent names across sessions.** Your
          `amp_run_ticket` tool description lists every currently available specialist — their name,
          and a summary of what each covers — generated from the agents the harness loaded. Read that
          list each time you plan. It is always accurate to what's deployed right now; a roster written
          into this skill would go stale the moment an agent is added, renamed, or retired.
      - find: "If nothing in the current list fits the work, load\n`skill(\"amp-agent-builder\")` to mint a new specialist — don't force-fit an existing one."
        replace: "If nothing in the current list fits the work, tell your user which\nspecialist is missing — don't force-fit an existing one."
      - find: "1. Load the code-reviewer skill: skill(\"code-reviewer\")"
        replace: "1. Load the **code-reviewer** skill"
      - find: "both touch .opencode/skills/amp-kb/SKILL.md"
        replace: "both touch web/src/pages/Board.tsx"
      - paragraph: "For every task in `ready_to_dispatch`, do both steps in this order"
        with: |
          For every task in `ready_to_dispatch`, run it with `amp_run_ticket`, using the task's own `assigned_to` value as the agent — not a fixed name. Call it once per task in a single message, so they run in parallel:
      - paragraph: "**Step 1 — dispatch each task**"
        with: |
          ```
          amp_run_ticket(task_id=ID, agent_id=<task's assigned_to>)
          amp_run_ticket(task_id=ID, agent_id=<task's assigned_to>)
          ```
      - find: "**Step 2 — launch each worker in the same message, with its returned `worker_prompt`,** as the prompt (so they run in parallel):\n```\ntask(prompt=<the worker_prompt from dispatch>, subagent_type=<task's assigned_to>)\ntask(prompt=<the worker_prompt from dispatch>, subagent_type=<task's assigned_to>)\n```"
        replace: "`amp_run_ticket` does both steps in one call: it dispatches the ticket in AMP and starts the worker. In the chat it returns an acknowledgement at once and the worker runs in the background: end your turn, and its result opens a later turn as a `[worker summaries]` entry. In `amp-harness run -p` it returns when the worker finishes."
      - find: "The `worker_prompt` already carries the ticket ID, project ID and `dispatch_id`, and tells the\nworker to call `amp_claim_task(task_id, dispatch_id)` first and complete or block the ticket\nitself. Don't retype a prompt of your own:"
        replace: "The harness handles the claim for its worker (the ticket is started when the worker process\nstarts, not before), and the worker completes or blocks the ticket itself. Don't write a prompt of\nyour own:"
      - paragraph: "Step 1 must happen before step 2, and step 2 must happen before your turn ends."
        with: |
          `amp_run_ticket` marks each ticket dispatched in AMP before it starts the worker (this is what shows live progress on the board). In the chat it returns at once and the worker's result arrives in a later turn; in `amp-harness run -p` it returns when the worker finishes. A dispatch the harness doesn't follow with a worker is returned to ready by AMP's watchdog (flagged at 10 minutes, returned at 30), and the harness releases the tickets it dispatched whose worker didn't run when it starts.
      - find: "- `not_started` — dispatched, nobody claimed it yet; launch its worker now (its `worker_prompt` is\n  in `amp_get_task`'s `dispatch_id`/`next`) or undo the dispatch at once."
        replace: "- `not_started` — dispatched, its worker never settled into the run; run it now with\n  `amp_run_ticket`, or undo the dispatch at once."
      - find: "| `not_started` in `amp_list_tasks` (dispatched, no worker claimed it) | nobody ever launched the worker, or it died before its first call | launch the worker now with its `worker_prompt`; if you won't, `amp_set_task_state(task_id, state=\"backlog\", reason=\"not started\")` |"
        replace: "| `not_started` in `amp_list_tasks` (dispatched, no worker running) | the run never settled into a worker, or it died before its first call | run it again now with `amp_run_ticket`; if you won't, `amp_set_task_state(task_id, state=\"backlog\", reason=\"not started\")` |"

  skills/amp-execution/SKILL.md:
    body:
      # The harness claims for its worker (D7): amp_run_ticket reads the dispatch_id and calls
      # amp_claim_task itself before the worker's first prompt. The skill keeps the opencode/Claude
      # instructions; the harness asset says what is actually true there.
      - paragraph: "## Step 0 — Claim your ticket (if you have a dispatch ID)"
        with: |
          ## Step 0 — Your ticket, and its dispatch

          Your manager's `amp_run_ticket` call dispatched this ticket, and the harness **starts it as it
          starts your run**: the ticket should already read `phase: "started"`, with `started_by` naming
          your agent. The dispatch ID is in your `<amp_context>` block, and the harness puts it on your
          `amp_complete_task` and `amp_block_task` calls itself, so there is nothing to pass by hand.

          - If the ticket already reads `started`, go on to Step 0.5: it is yours.
          - If it still reads `not_started` (an older harness that leaves the claim to the worker), call
            `amp_claim_task(task_id=YOUR_TASK_ID, dispatch_id="<the dispatch ID in your context>")` first.
            A failed claim is not a reason to stop: your first write on the ticket starts it as
            `started_by: "inferred"`.

          Never end a run without one of `amp_complete_task` or `amp_block_task` (Step 6 / Step 5): a
          started ticket that goes silent for 15 minutes is flagged quiet, and the harness records an
          abandoned run and returns the ticket to ready when your run ends without closing it.
      # The opencode/Claude instructions that follow the header are for a manager that dispatches and
      # relies on the worker to claim; the harness claims in amp_run_ticket, so they are replaced.
      - paragraph: "A ticket is *dispatched* before a worker starts it, and until you claim it AMP shows it as"
        with: ""
      - paragraph: "amp_claim_task(task_id=YOUR_TASK_ID, dispatch_id=\"<your dispatch ID>\")"
        with: ""
      - paragraph: "- **Your prompt has a dispatch ID → claim first, before anything else.**"
        with: ""
      # amp_run_ticket's dispatch_id never reaches the prompt in the harness: the harness injects it
      # into the worker's complete/block calls itself (D8), so the worker has nothing to pass.
      - paragraph: "**Pass your `dispatch_id`.** It is what makes this *your* completion rather than a closeout:"
        with: |
          **The dispatch ID is filled in for you.** The harness injects it into your `amp_complete_task`
          and `amp_block_task` calls, so AMP records "completed by <you>" rather than a closeout. Pass it
          yourself too if you happen to have it (it's in your context block): it is never harmful. Your
          model, tokens, git details and the run outcome are reported automatically as well — report them
          only if you know something the harness can't (a PR opened after you finished, for instance).
      - paragraph: "**Check the `dispatch_id` too.**"
        with: |
          **Check the ticket really is this run's.** The harness dispatched it to you and claimed it
          seconds ago, so it should be `in_progress` and started by your agent. If it reads `in_progress`
          but owned by someone else, or it was returned and dispatched again in the meantime, stop: comment
          what you see and end your run rather than working a ticket another worker is on.
      - find: "(opencode's `execute`, scripts, tests)"
        replace: "(scripts, tests)"
      - find: "← if your harness has it (opencode with the AMP plugin): your model,"
        replace: "← if your harness has it (amp-harness does): your model,"
      - find: "← opencode plugin: your own model/tokens/cost"
        replace: "← your own model/tokens/cost"

  skills/amp-mcp/SKILL.md:
    body:
      - find: "the harness plugin provides it (Claude Code with the AMP plugin, opencode)"
        replace: "the harness provides it (amp-harness, and the AMP plugin for other hosts)"

