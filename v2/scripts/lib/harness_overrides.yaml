        replace: |-
          Use this skill when there is no `.amp.json` in the current directory.

          In amp-harness, a folder is linked by `amp-harness init` (the person; it creates or picks the project, writes `.amp.json` and never overwrites a parent folder's), or by you with this skill when there is no `.amp.json` here or above. If `<amp_context>` has a `project_marker_note`, the session's `.amp.json` belongs to a parent folder: when the person asks to set up a new project here, don't create it or plan in the parent's project — tell them which project the folder uses now and where its `.amp.json` is, and ask them to run `amp-harness init` in this folder and start the chat again. Never write `.amp.json` over a parent folder's.
      - paragraph: "You also need the URL of the user's AMP server for `amp_api`."
        with: |
          You also need the URL of the user's AMP server for `amp_api`: in the harness it is the
          origin of `amp_server` in your `<amp_context>` (e.g. `http://localhost:18000` for
          `http://localhost:18000/mcp`). Use it; don't ask.
      - paragraph: "- If the harness's AMP MCP config already points at a server"
        with: ""
      - find: "If you don't already have a name and code from the user, infer them from the directory name and ask for confirmation."
        replace: "If your user didn't give a name and code, pick them from what they told you about the project (the folder name only when that's all you have), create the project, and say they can rename it. Don't stop to ask first."
      - find: "Write that to `.amp.json` in the current directory. Commit it — everyone working here shares the same project."
        replace: "Write that to `.amp.json` in the working directory with the `write` tool (the one file you may write). Don't commit it yourself: tell your user to commit it, or let the first worker's ticket include it, so everyone working here shares the same project."

  skills/amp-design-tools/SKILL.md:
    body:
      - find: "In opencode with AMP's plugin, use the `amp_publish_artifact_file` tool instead\n(it knows AMP's address and your token). If neither is available, publish with"
        replace: "If they aren't set, publish with"

  skills/amp-image-gen/SKILL.md:
    body:
      - find: "`OPENROUTER_API_KEY`, or opencode's stored OpenRouter key. If neither\n  exists,"
        replace: "`OPENROUTER_API_KEY`. If it isn't set,"

global:
  # opencode skill calls → the harness's skills (listed in the system prompt, preloaded per role).
  - regex: '`?skill\("([a-z0-9-]+)"\)`?'
    replace: 'the **\1** skill'
  # opencode tool names → the harness's (rpi-tools: read, write, edit, bash, grep, find, ls).
  - regex: '`task` tool'
    replace: '`amp_run_ticket` tool'
  - regex: '`edit`/write'
    replace: '`edit`/`write`'
  - regex: '`glob`'
    replace: '`find`'

banned:
  - 'amp_amp_'
  - 'subagent_depth'
  - '\.opencode/'
  - '\bopencode\b'
  - '`task` tool'
  - 'skill\('
  - 'subagent_type'
  - '\btask\(prompt='
  - 'amp-agent-builder'
  - 'amp_publish_artifact_file'
