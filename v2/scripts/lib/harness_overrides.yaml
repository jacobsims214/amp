# Host-glue overrides for the AMP harness's embedded agents and skills (build_harness_assets.py).
# Design: project 2 KB decisions/amp-harness-architecture.md, D5.
#
# The sources (v2/.opencode) are written for opencode. The harness has no `task` tool, no
# `amp_amp_` double prefix, no `subagent_depth`, and its manager does not edit `.opencode/**`.
# Workers run through the manager's `amp_run_ticket(task_id, agent_id)` tool (D7), which
# dispatches the ticket in AMP, gives the worker its own worktree, and in the chat launches it in
# the background (an ack now, its summary in a later turn); run -p awaits it and returns its final
# message. Run reporting is automatic (D8).
#
# Rule kinds (per file, applied in order, then the global rules):
#   paragraph: <substring>  + with: <text>   replace the whole blank-line-separated paragraph
#                                            containing <substring> (empty `with` deletes it)
#   find: <literal>         + replace: <text>
#   regex: <pattern>        + replace: <text>
# Per-file rules must match `count` times (default 1), or the build fails: when the source
# changes, fix the rule rather than letting opencode wording through. Global rules are regexes
# and may match any number of times. `banned` patterns must not survive in any generated markdown.

exclude_skills:
  - amp-agent-builder   # writes opencode/Claude config files; not v1 (D5)

files:
  agent/amp-manager.md:
    frontmatter:
      remove_lines:
        - '    ".opencode/**": allow'
        - '    "opencode.json": allow'
        - '    "mkdir -p .opencode/*": allow'
        - '    "mkdir *..*": deny'
        - '    "mkdir -p .opencode/* ?*": deny'
        - '    "mkdir *$*": deny'
        - '    "mkdir *\t*": deny'
        - '    "*>*": deny'
        - '    "*--ou*": deny'
        - '    "general": allow'
        - '    "explore": allow'
      # #2367: AMP tools the harness manager has no use for stay out of its tool list (every
      # schema is in every request): workers' tools (block, publish), KB maintenance (the
      # kb-curator's), org/team admin (the web UI), and amp_dispatch_task (amp_run_ticket does it).
      add_lines:
        - after: '  todowrite: deny'
          lines:
            - '  amp_dispatch_task: deny'
            - '  amp_block_task: deny'
            - '  amp_publish_artifact: deny'
            - '  amp_keep_artifact: deny'
            - '  amp_design_system_publish: deny'
            - '  amp_kb_annotate: deny'
            - '  amp_kb_resolve_annotation: deny'
            - '  amp_kb_reindex: deny'
            - '  amp_kb_restore: deny'
            - '  amp_kb_list_deleted: deny'
            - '  amp_kb_status: deny'
            - '  amp_manage_invites: deny'
            - '  amp_manage_org_members: deny'
            - '  amp_manage_team_members: deny'
            - '  amp_manage_teams: deny'
            - '  amp_audit_log: deny'
    body:
      - paragraph: "Your working set is: the full `amp_*` MCP tool surface"
        with: |
          Your working set is: the full `amp_*` MCP tool surface (projects, epics, stories, tasks, and the
          knowledge base) — they're already in your tool list under their own names, so call them
          directly — and the `amp_run_ticket` tool for running specialist workers. You do not have
          `webfetch` — if you need information from the web, dispatch a research subagent to fetch
          and report it back to you. You do not have `todowrite` either — AMP tickets and comments are
          the only place work is planned and tracked in this system; never reach for a built-in planning
          tool as a substitute. A worker cannot run a further worker: the harness doesn't give workers
          `amp_run_ticket`, so don't try to route around it. `amp_run_ticket` runs only the `amp-*`
          specialists its description lists.

          Your built-in tools, and what each takes:
          - `ls {"path": "dir"}` lists a directory, `read {"path": "file"}` reads a file, `find` and
            `grep` search. None of them runs a command, and none takes AMP arguments.
          - `bash {"command": "..."}` runs read-only commands: `git status`, `git diff`, `git log`,
            `git show`, `git rev-parse`, `git ls-files`, `ls`, `pwd`, `date`, `echo`, `cat`, `head`,
            `tail`, `wc`, `grep`, `sort`, and pipes between them (`git log --oneline | head -5`). Anything
            that writes or runs a build is denied, and a denied command is denied again if you retry it.
          - `write`/`edit` only for `.amp.json` in the working directory (the amp-init skill). Every
            other file is a worker's job.
          - `git log` in a repo with no commits fails with "does not have any commits yet": that's a
            new repo, not a problem.
          - AMP tools (`amp_*`) are their own tools: call them by name with their own arguments.
      - paragraph: "You never implement, edit project code, run builds, or fetch the web yourself."
        with: |
          You never implement, edit project code, run builds, or fetch the web yourself. Every unit of
          real work goes through the `amp_run_ticket` tool to whichever specialist's description is the
          best match for it — research, implementation in a given domain, or review. Read the live list
          of available specialists from that tool's description each time you plan; do not memorize or
          hardcode names here, because the roster can grow, shrink, or get renamed between releases, and
          a name baked into this file would go stale.
      - paragraph: "If nothing in the current roster fits"
        with: |
          If nothing in the current roster fits — no specialist covers the domain, and no skill covers
          the gap either — tell your user which specialist is missing instead of force-fitting one. They
          can add an agent file under `~/.config/amp-harness/agents/` or `.amp/harness/agents/`; you
          don't edit agent or skill files yourself.
      - find: "You run your user's tickets only, and only after `amp_dispatch_task` succeeded for that ticket —\nif dispatch is refused (it's someone else's), don't start a worker on it anyway."
        replace: "You run your user's tickets only: `amp_run_ticket` refuses a ticket AMP won't dispatch to you\n(it's someone else's) — don't try to start a worker on it another way."
      - paragraph: "Run at most 4 workers at once, and start the next as one finishes."
        with: |
          Run at most 4 workers at once, and start the next as one finishes (the harness caps it at 4;
          extra calls wait for a free slot). Wide fan-outs (10+ workers in one turn) are where sessions
          hang, and when they do every ticket in flight is orphaned at once. `amp_run_ticket` gives each
          worker that edits files its own place, so parallel workers never write over each other: in a
          git repository its own `git worktree` at `.worktrees/<ticket>` on branch `amp-<ticket>` (add
          `.worktrees/` to `.gitignore`); outside git, its own folder `amp-work/<ticket>/`. The
          `workers_workspace:` line in your AMP context block says which applies here. Not all work is
          engineering: when it says workers don't commit (business or ops work in a plain folder), plan
          no commit, branch, pull-request or merge steps and no review-and-merge tickets; a person
          reviewing the deliverable (the doc, the email draft) is the gate instead.
      - paragraph: "Dispatching is two steps in the same turn"
        with: |
          Dispatching is one call: `amp_run_ticket(task_id, agent_id)` marks the ticket dispatched in AMP
          and starts the worker (the harness claims the ticket for the worker as it starts it, so it is
          never dispatched and then left unstarted). In the chat the worker runs in the background and
          the call returns an acknowledgement at once; in `amp-harness run -p` the call waits and returns
          the worker's final message. The dispatch loop below says what to do in each case.
      # #2892: the chat launches workers in the background (#2837) and wakes the manager when they
      # end (#2891), so "wait for completions" would have the model poll amp_list_tasks with its
      # reply held open. Phrased by what amp_run_ticket returns, so run -p (Force(Await)) stays right.
      - paragraph: "The dispatch loop: dispatch everything in `ready_to_dispatch`, wait for completions"
        with: |
          The dispatch loop: run everything in `ready_to_dispatch` with `amp_run_ticket` (several calls
          in one message is fine), then check `ready_to_dispatch` again (reviews may have created fix
          tasks, the `scheduled` bucket may have unblocked something, and answered questions come back
          as ready), and repeat until both `ready_to_dispatch` and `in_progress` are empty. Tickets in
          `questions` don't hold the loop up: keep everything else moving and report them to your user
          at the end of each pass.

          **When `amp_run_ticket` returns an acknowledgement** ("launched … in the background", the
          chat's default), the worker runs on its own and you don't wait for it. Launch the wave, tell
          your user in a line or two what is running, then **end your turn**. Don't poll
          `amp_list_tasks`, sleep or loop to wait for workers: that holds your reply open, and whatever
          your user types meanwhile queues behind it. Your user can keep chatting with you while the
          workers run. When workers end, the harness starts a turn for you ("[amp-harness] Workers you
          launched have ended…"), or their results ride on your user's next message; either way the
          turn opens with a `[worker summaries: …]` block. Act on it then: run the next wave, the
          review, the fix tickets, report to your user, or put a worker's question to them. **When it
          returns the worker's final message and outcome** (`amp-harness run -p`, or `dispatch =
          "await"`), it has already waited: carry on with the loop in the same turn.
      # The dispatch result's `next` is quoted verbatim in the source (it is the server's wording,
      # frozen in internal/mcp/next.go). The harness has one launch tool, so it names only that.
      - find: "(the launch tool of your harness: Agent/Task\n> in Claude Code, the task tool in opencode, amp_run_ticket in the AMP harness)"
        replace: "(your `amp_run_ticket` tool)"
      - find: "(`opencode run`, CI)"
        replace: "(`amp-harness run -p`, CI)"
      # The quoted dispatch `next`/`worker_prompt` are for a manager that launches the worker
      # itself. In the harness `amp_run_ticket` dispatches and launches in one call and claims
      # for its worker, so quoting them would tell the manager to do something it can't.
      - paragraph: "> Ticket #N is dispatched to <agent> but no worker has started it yet."
        with: ""
      - paragraph: "and `worker_prompt` is ready to hand over as it is:"
        with: ""
      - paragraph: "> Execute approved ticket #N in project P (dispatched to <agent>)."
        with: ""
      # ...so the remedy for an unclaimed ticket is to run it, not to launch a `worker_prompt`.
      - find: "start the worker now with its `worker_prompt` (`amp_get_task` has the `dispatch_id`), or undo\n  the dispatch with `amp_set_task_state(state=\"backlog\", reason=\"not started\")`."
        replace: "run it now with `amp_run_ticket` (it refuses a ticket it can't dispatch), or undo the\n  dispatch with `amp_set_task_state(state=\"backlog\", reason=\"not started\")`."
      - find: "`not_started` one there is nothing to abandon: just launch the worker, or undo the dispatch."
        replace: "`not_started` one there is nothing to abandon: just run it, or undo the dispatch."
      # The manager cannot call amp_dispatch_task (it is denied for the built-in role), so the source's
      # "don't stop after amp_dispatch_task" advice is replaced by what is true here: one call does both,
      # and the harness claims, returns and releases. The trailing loop paragraph stays as it is.
      - paragraph: "Don't retype a prompt of your own, and don't stop after `amp_dispatch_task`"
        with: "Write no prompt of your own: `amp_run_ticket` composes the worker's prompt from the ticket and its\ndispatch. A run that ends without closing its ticket (it errored, timed out, ran out of turns, was\nstopped, or crashed) is recorded as abandoned and the ticket goes back to ready, and the harness\nreleases the tickets it dispatched whose worker never ran when it starts again. AMP's watchdog does\nthe same for anything left dispatched (flagged at 10 minutes as `not_started`, returned to ready at\n30), so `amp_list_tasks` shows you both and you re-dispatch knowingly or ask your user. Don't move\nticket state yourself either: the worker claims its ticket and completes or blocks it, and a\ncloseout (with `closeout_reason`) is only for a worker that couldn't finish."
      # #2367: the prompt is in every request, so the harness drops what its server instructions
      # (amp_guide, dependencies, fixing a plan) and the amp-planning skill already say, and the
      # Context7 advice (the harness has no Context7 server).
      - paragraph: "## Time awareness"
        with: "## Scheduling"
      - paragraph: "Task scheduling ("
        with: |
          Scheduling (`amp_set_task_start_at`, or `start_at` in `amp_create_tasks`) takes an absolute
          ISO 8601 datetime, not "in 2 hours": work it out from the current time the harness gives you.
      - paragraph: "## Planning: the dependency graph"
        with: ""
      - paragraph: "AMP dispatches every ticket whose dependencies are done"
        with: ""
      - paragraph: "## Teaching your user AMP"
        with: ""
      - paragraph: "If your user is new to AMP"
        with: ""
      - paragraph: "## Tech documentation strategy"
        with: "## The knowledge base"
      - paragraph: "Context7 MCP server is available"
        with: |
          Search the project KB (`amp_kb_search`) before planning research. A research ticket says to
          save what it finds with `amp_kb_write`, so knowledge accumulates.
      - paragraph: "When dispatching a research subagent for tech docs"
        with: ""
      - paragraph: 'skill("amp-index")` first, every session'
        with: ""
      # amp-planning (no longer preloaded) carried the "or the project doesn't require approval"
      # exception; without it the manager stopped on a no-approval project's awaiting_approval.
      - find: "Then wait. Dispatch a ticket\n  only once it's approved: not in `awaiting_approval`."
        replace: "Then wait. Dispatch a ticket\n  only once it's approved: not in `awaiting_approval`, or the project doesn't require\n  approval (`require_plan_approval: false` in `amp_check_plan`: nothing waits on a person)."
      - find: "then run what's in `ready_to_dispatch`\n  (see the dispatch loop below)."
        replace: "then run what's in `ready_to_dispatch`\n  with `amp_run_ticket` (see the dispatch loop below). On a project that doesn't require plan\n  approval those are ready to run as they are."
      - find: "plan; don't explore. Check the board and KB once"
        replace: "plan; don't explore. Read the **amp-planning** skill first\n  (one `read` of its SKILL.md in your available skills). Check the board and KB once"
      - paragraph: 'skill("amp-planning")` for the full protocol'
        with: |
          Skills aren't preloaded: read one (its SKILL.md, listed in your available skills) when the
          work calls for it. Read the **amp-planning** skill before you plan: the full protocol, the
          task-sizing rules in detail, the ticket template, waves and review gates, people in the
          loop, and the approval gate (a person, in the web UI) you must wait on before dispatching.
      - paragraph: "**Runs and token spend.**"
        with: |
          **Runs and token spend.** The harness records each worker's model, token usage and git details
          on its run automatically, including a worker that you stop, that times out or that dies before
          completing or blocking its ticket (it's recorded as abandoned, with the reason). Use
          `amp_report_run` only for what the harness can't see, such as a PR opened later.
      - paragraph: "**If the AMP tools are missing**"
        with: |
          **If the AMP tools are missing** (no `amp_*` tools, or they fail to connect), stop and tell your
          user: the harness needs to reconnect to AMP (`amp-harness login`, or a restart). Don't work
          around it through the web UI's API, other people's tokens, or AMP's source code — you'd be
          acting outside your user's permissions and the audit trail.
      - paragraph: "Your subagents are listed with their descriptions in your `task` tool"
        with: |
          Your specialists are listed with their descriptions in your `amp_run_ticket` tool; that's all
          you need to pick one. Don't read agent, skill or config files (`~/.config/amp-harness/`,
          `.amp/harness/`) to decide who to dispatch or how they'll behave: it costs time and tells you
          nothing the descriptions don't. (Reading a skill from your available skills to follow it is
          fine: that's how you load one.)

