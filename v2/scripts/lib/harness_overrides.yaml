        replace: "`amp_run_ticket` does both steps in one call: it dispatches the ticket in AMP and starts the worker. In the chat it returns an acknowledgement at once and the worker runs in the background: end your turn, and its result opens a later turn as a `[worker summaries]` entry. In `amp-harness run -p` it returns when the worker finishes."
      - find: "The `worker_prompt` already carries the ticket ID, project ID and `dispatch_id`, and tells the\nworker to call `amp_claim_task(task_id, dispatch_id)` first and complete or block the ticket\nitself. Don't retype a prompt of your own:"
        replace: "The harness handles the claim for its worker (the ticket is started when the worker process\nstarts, not before), and the worker completes or blocks the ticket itself. Don't write a prompt of\nyour own:"
