services:
  postgres:
    image: postgres:16-alpine
    container_name: amp-postgres
    environment:
      POSTGRES_USER: amp
      POSTGRES_PASSWORD: amp
      POSTGRES_DB: amp
    ports:
      - "5432:5432"
    volumes:
      - amp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  typesense:
    image: typesense/typesense:30.1
    container_name: amp-typesense
    ports:
      - "8108:8108"
    volumes:
      - amp-tsdata:/data
    command: "--data-dir /data --api-key=amp-local-dev --enable-cors"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: amp-ollama
    ports:
      - "11434:11434"
    volumes:
      - amp-ollama:/root/.ollama
      - ./certs:/certs:ro
    environment:
      SSL_CERT_FILE: /certs/bundle.pem
    restart: unless-stopped

  amp-api:
    build:
      context: .
      dockerfile: amp-api/Dockerfile
    container_name: amp-api
    ports:
      - "8000:8000"   # MCP server (SSE) — used by opencode agents
      - "3001:3001"   # REST + SSE API — used by the UI
    environment:
      DATABASE_URL: postgres://amp:amp@postgres:5432/amp?sslmode=disable
      MCP_ADDR: :8000
      API_ADDR: :3001
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: amp-local-dev
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: nomic-embed-text
      # Auth is off here (no OIDC_ISSUER_URL), so there's no UI token to
      # check: REST (:3001, what the UI calls) counts as a person in the web
      # UI, and MCP (:8000) never does. Plan approval, artifact approval and
      # human tickets are therefore done in the UI; agents over MCP are
      # refused with a link to the page, built from APP_PUBLIC_URL.
      # APP_PUBLIC_URL is the UI's address as the browser sees it (the ui
      # service's host port below). It makes approve_url, refusal links and
      # artifact URLs absolute; without it links are relative and artifact
      # URLs are left out. Change it if you publish the UI on another port.
      APP_PUBLIC_URL: http://localhost:5173
      # Remote control (epic 165) is off here: the relay is its own service,
      # amp-relay, which this stack doesn't run (amp-api serves no relay
      # route). A warned, loopback-only dev override that adds it is
      # docker-compose.remote-dev.yml.
      # Verification receipt evidence (#126): screenshots and videos, on the
      # amp-receipts volume. It stays empty while every project's receipts
      # setting is Off (the default). To keep them in the bundled SeaweedFS
      # (S3) instead, add docker-compose.seaweedfs.yml (see the seaweedfs
      # service below).
      RECEIPT_DIR: /data/receipts
    volumes:
      - amp-receipts:/data/receipts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Opt-in S3 store for receipt evidence (#126, #144): SeaweedFS
  # (Apache-2.0). Off by default: the seaweedfs profile starts it, and
  # docker-compose.seaweedfs.yml points amp-api at it:
  #   docker compose -f docker-compose.yml -f docker-compose.seaweedfs.yml --profile seaweedfs up -d
  # No host port: only amp-api reaches it, on this network. Evidence is still
  # served to browsers by amp-api, never by SeaweedFS. The access key pair
  # is SEAWEEDFS_ACCESS_KEY / SEAWEEDFS_SECRET_KEY: the defaults are
  # well-known local-dev values, so set both on any shared host. The
  # inline `configs:` entry below needs Docker Compose v2.23.1 or later.
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    container_name: amp-seaweedfs
    profiles: ["seaweedfs"]
    # One process: master, volume, filer and the S3 gateway on :8333. The
    # image's entrypoint adds -dir=/data -volume.max=0
    # -master.volumeSizeLimitMB=1024 and drops to its seaweed user (uid 1000).
    # Master, volume and filer listen on loopback only; only S3 and its gRPC
    # port are on the compose network. That gRPC port's admin calls, and
    # filer writes, need a token signed with WEED_JWT_FILER_SIGNING_KEY
    # (SEAWEEDFS_JWT_SIGNING_KEY; set it on a shared host too). Iceberg and
    # Lance are off; no telemetry.
    command: ["server", "-ip=127.0.0.1", "-ip.bind=127.0.0.1", "-s3", "-s3.ip.bind=0.0.0.0", "-s3.port=8333",
              "-s3.port.iceberg=0", "-s3.port.lance=0", "-s3.config=/etc/seaweedfs/s3.json", "-master.telemetry=false"]
    environment:
      WEED_JWT_FILER_SIGNING_KEY: ${SEAWEEDFS_JWT_SIGNING_KEY:-amp-local-dev-seaweedfs-jwt-signing-key}
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    volumes:
      - amp-seaweedfs:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: amp-ui
    ports:
      - "5173:8080"   # Kanban board — http://localhost:5173 (nginx in the UI image listens on 8080)
    depends_on:
      - amp-api
    restart: unless-stopped

# SeaweedFS's S3 identities: one key pair, allowed only the receipts bucket.
configs:
  seaweedfs-s3:
    content: |
      {"identities": [{"name": "amp-api",
        "credentials": [{"accessKey": "${SEAWEEDFS_ACCESS_KEY:-amp-local-dev}", "secretKey": "${SEAWEEDFS_SECRET_KEY:-amp-local-dev-secret}"}],
        "actions": ["Admin:amp-receipts", "Read:amp-receipts", "Write:amp-receipts", "List:amp-receipts", "Tagging:amp-receipts"]}]}

volumes:
  amp-pgdata:
  amp-receipts:
  amp-seaweedfs:
  amp-tsdata:
  amp-ollama:
