# The UI's nginx (copied by Dockerfile). Every path falls back to index.html.
server {
  listen 8080;
  root /usr/share/nginx/html;
  absolute_redirect off;

  location / { try_files $uri $uri/ /index.html; }

  # The remote session page (remote control, ticket #2372). Strict CSP from
  # src/remote/csp.ts (csp.test.ts keeps the two identical). try_files serves
  # index.html *inside* this location: an internal redirect to /index.html would
  # land in `location /` and drop these headers.
  location /sessions/ {
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location /api/ {
    proxy_pass http://amp-api:3001;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }
}
