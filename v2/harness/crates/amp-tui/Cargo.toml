[package]
name = "amp-tui"
description = "AMP chat shell on rpi-tui: theme, header, status line, slash commands (D1, D10)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
amp-core.workspace = true
rpi-ai.workspace = true
rpi-agent.workspace = true
rpi-harness.workspace = true
rpi-tui.workspace = true
# The same crossterm rpi-tui is built on (its Editor takes crossterm 0.27 key events).
crossterm = { version = "=0.27.0", features = ["events", "bracketed-paste"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
