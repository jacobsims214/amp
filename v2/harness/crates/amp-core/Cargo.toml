[package]
name = "amp-core"
description = "AMP harness core: rpi glue, config, roles, tool policy, worker supervisor (D1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
amp-mcp.workspace = true
# `providers`: rpi's HTTP providers (Anthropic Messages, OpenAI Chat Completions); off by default.
rpi-ai = { workspace = true, features = ["providers"] }
rpi-agent.workspace = true
rpi-tools.workspace = true
rpi-harness.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
keyring.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tokio-util.workspace = true
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
