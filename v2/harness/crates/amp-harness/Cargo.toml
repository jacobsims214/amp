[package]
name = "amp-harness"
description = "The amp-harness binary (D1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "amp-harness"
path = "src/main.rs"

[dependencies]
amp-core.workspace = true
amp-mcp.workspace = true
amp-tui.workspace = true
clap.workspace = true
# Hidden key entry in raw mode (setup). Same version and features rpi-tui uses.
crossterm.workspace = true
toml.workspace = true
rpi-agent.workspace = true
rpi-harness.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
x509-parser.workspace = true

[dev-dependencies]
# tests/clock.rs: parse the clock stamp's UTC time (#2250).
chrono.workspace = true
async-trait.workspace = true
axum.workspace = true
# The in-process mock AMP: rmcp's server side + Streamable HTTP server transport.
# transport-io: tests/mcp_hub.rs runs its own binary as a stdio MCP server (#2239).
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server", "transport-io"] }
serde_json.workspace = true
# tests/supervisor.rs: faux steps and cancellation tokens.
rpi-ai.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "process"] }
tokio-util.workspace = true
# tests/mcp_cli.rs (#2243): amp-mcp's legacy SSE mock (futures) and the scripted OAuth browser
# (reqwest); both already in the lock.
futures.workspace = true
reqwest.workspace = true
# tests/doctor.rs: an HTTPS mock AMP signed by a private CA.
rcgen.workspace = true
time.workspace = true
tokio-rustls.workspace = true

# tests/setup_ctrl_c.rs: a real pty for the setup prompts (#2227). Same version and features amp-tui uses.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", default-features = false, features = ["term"] }

# tests/mcp_hub.rs re-runs its own binary as the stdio MCP server, so it owns main() (#2239).
[[test]]
name = "mcp_hub"
harness = false

# tests/mcp_cli.rs runs its own binary as a stdio MCP server too (#2243).
[[test]]
name = "mcp_cli"
harness = false

# tests/chat_panels.rs too (#2245).
[[test]]
name = "chat_panels"
harness = false

[lints]
workspace = true
