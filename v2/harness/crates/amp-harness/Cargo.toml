[package]
name = "amp-harness"
description = "The amp-harness binary (D1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "amp-harness"
path = "src/main.rs"

[dependencies]
amp-core.workspace = true
amp-mcp.workspace = true
amp-tui.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
axum.workspace = true
# The in-process mock AMP: rmcp's server side + Streamable HTTP server transport.
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "process"] }

[lints]
workspace = true
