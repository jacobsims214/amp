[package]
name = "amp-harness"
description = "The amp-harness binary (D1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "amp-harness"
path = "src/main.rs"

[dependencies]
amp-core.workspace = true
amp-mcp.workspace = true
amp-tui.workspace = true
clap.workspace = true
rpi-agent.workspace = true
rpi-harness.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
x509-parser.workspace = true

[dev-dependencies]
async-trait.workspace = true
axum.workspace = true
# The in-process mock AMP: rmcp's server side + Streamable HTTP server transport.
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
serde_json.workspace = true
# tests/supervisor.rs: faux steps and cancellation tokens.
rpi-ai.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "process"] }
tokio-util.workspace = true
# tests/doctor.rs: an HTTPS mock AMP signed by a private CA.
rcgen.workspace = true
time.workspace = true
tokio-rustls.workspace = true

[lints]
workspace = true
