[package]
name = "amp-mcp"
description = "AMP MCP client on rmcp: connect, auth, tool catalog. No rpi dependencies (D1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
keyring.workspace = true
oauth2.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# net + io-util: the OAuth loopback redirect listener; rt: keychain calls run on the blocking pool.
tokio = { workspace = true, features = ["net", "io-util", "rt"] }
toml.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
axum.workspace = true
base64.workspace = true
rcgen.workspace = true
# The in-process test servers: rmcp's server side + Streamable HTTP server transport (#2082 note).
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tokio-rustls.workspace = true

[lints]
workspace = true
